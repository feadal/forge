<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="description" content="Программа тренировок и питание под тебя. Дневник подходов с таймером отдыха. Работает без интернета.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<title>FORGE</title>
<script>try{var t=(JSON.parse(localStorage.getItem('forge_v2')||'{}')||{}).theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* FORGE · «Гриф». Colour comes from the gym floor: the IWF 20 kg plate blue, bar steel, chrome
   sleeves, platform rubber and chalk. The accent has one job: the set you are doing now. */
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --ground:#F7F8FA; --band:#EAEEF3; --pocket:#FFFFFF; --key:#EEF1F5; --sheet:#FFFFFF;
  --ink:#0E131B; --ink-2:#485263; --ink-3:#5E6879; --ghost:#5F6A7C; --pending:#7A8597;
  --accent:#1546BE; --accent-tint:#E4EAF9; --on-accent:#FFFFFF;
  --danger:#B42318; --on-danger:#FFFFFF;
  --rubber:#141922; --on-rubber:#F3F5F8; --on-rubber-2:#A4AEBD; --on-rubber-fill:rgba(243,245,248,.12);
  --accent-on-rubber:#5C86EE;
  --tab-on:rgba(255,255,255,.95); --ret:var(--ink); --on-ret:var(--ground);
  --grabber:#CDD3DC; --glass:rgba(250,251,253,.78); --scrim:rgba(14,19,27,.22); --shade:14,19,27;
  --sel:#D6DEE9; --seg-on:#FFFFFF; --slab:#B9C1CC;

  --steel:#8E98A7; --steel-dark:#3A424E; --chrome:#C3CAD4; --glint:#FFFFFF;
  --plate-1:#1546BE; --plate-2:#2C5BCB; --plate-3:#4D74D6; --plate-4:#7F9BE2;
  --knurl-base:#C9D0D9; --knurl-line:#5E6878; --shaft-spent:#39414D;

  --m:20px; --r-key:10px; --r-field:16px; --r-slab:26px; --r-sheet:34px;
  --dock:0px;
  --safe-b:max(env(safe-area-inset-bottom), 8px);
  --spring:linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077 22.5%, 1.111, 1.121 27.1%, 1.106 30.1%, 1.034 37.6%, 1.007 41.9%, .988 47.1%, .996 59.6%, 1);
}
/* Dark: follows the phone unless the app is pinned to a theme in Settings. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --band:#181C23; --pocket:#222730; --key:#222730; --sheet:#181C23;
    --ink:#EEF1F5; --ink-2:#A3ADBC; --ink-3:#8A94A4; --ghost:#8C97AA; --pending:#6B7587;
    --accent:#5A83EC; --accent-tint:#1E2A47; --on-accent:#0B0F15; --danger:#F97066; --on-danger:#1A0806;
    --rubber:#222832;
    --tab-on:rgba(255,255,255,.13); --ret:#3B4350; --on-ret:#EEF1F5;
    --grabber:#3A414C; --glass:rgba(30,34,42,.76); --scrim:rgba(0,0,0,.45); --shade:0,0,0;
    --sel:#2C333F; --seg-on:#3B4350; --slab:#3A414C;
    --steel:#6E7887; --steel-dark:#C7CED8; --chrome:#8C96A5;
    --plate-1:#5A83EC; --plate-2:#6A90F0; --plate-3:#7C9DF0; --plate-4:#A5BBF4;
    --knurl-base:#8C96A5; --knurl-line:#2A313C; --shaft-spent:#2E3540;
  }
}
:root[data-theme="dark"]{
    --ground:#0E1116; --band:#181C23; --pocket:#222730; --key:#222730; --sheet:#181C23;
    --ink:#EEF1F5; --ink-2:#A3ADBC; --ink-3:#8A94A4; --ghost:#8C97AA; --pending:#6B7587;
    --accent:#5A83EC; --accent-tint:#1E2A47; --on-accent:#0B0F15; --danger:#F97066; --on-danger:#1A0806;
    --rubber:#222832;
    --tab-on:rgba(255,255,255,.13); --ret:#3B4350; --on-ret:#EEF1F5;
    --grabber:#3A414C; --glass:rgba(30,34,42,.76); --scrim:rgba(0,0,0,.45); --shade:0,0,0;
    --sel:#2C333F; --seg-on:#3B4350; --slab:#3A414C;
    --steel:#6E7887; --steel-dark:#C7CED8; --chrome:#8C96A5;
    --plate-1:#5A83EC; --plate-2:#6A90F0; --plate-3:#7C9DF0; --plate-4:#A5BBF4;
    --knurl-base:#8C96A5; --knurl-line:#2A313C; --shaft-spent:#2E3540;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:96px;background:var(--ground);-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100svh;background:var(--ground);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:22px;letter-spacing:-.022em;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;margin:0;padding:0;cursor:pointer;
  border:1px solid transparent;border-radius:0;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.35}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit;letter-spacing:inherit}
noscript{display:block;padding:24px var(--m)}

#app{max-width:520px;margin:0 auto;
  padding:max(env(safe-area-inset-top), 12px) 0 calc(var(--dock) + 28px);overflow-x:clip}
#app.view-wizard,#app.view-redflag,#app.view-summary,#app.view-welcome{min-height:100svh;display:flex;flex-direction:column;padding-bottom:0}
#app.view-wizard .bottom-action,#app.view-redflag .bottom-action,#app.view-summary .bottom-action,#app.view-welcome .bottom-action{margin-top:auto}
.welcome{flex:1}

/* icons: one set, one stroke per role */
.ic{display:inline-grid;place-items:center;flex:none;width:24px;height:24px}
.ic svg{width:100%;height:100%;stroke-width:1.75}
.i-sm{width:18px;height:18px}
.i-sm svg{stroke-width:2.2}
.i-mark{width:22px;height:22px}
.i-mark svg{stroke-width:2.7}
.i-go{width:30px;height:30px}
.i-go svg{stroke-width:2.2}

/* type scale 72 / 56 / 28 / 20 / 17 / 15 / 13, weights 400 · 600 · 800.
   Three deliberate exceptions: 48 is the overflow step for a 5-digit weight,
   11 is the floor for tab labels and chart axis numbers. */
.head-title,.wiz-title,.sum-title{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.025em}
.section-title{font-size:15px;line-height:20px;font-weight:600;color:var(--ink-2);letter-spacing:-.015em}
.fine{font-size:13px;line-height:18px;color:var(--ink-3);letter-spacing:-.005em}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;
  border-radius:var(--r-field);font-size:17px;line-height:22px;font-weight:600;text-align:center}
.btn-primary{background:var(--ink);color:var(--ground)}
.btn-quiet{background:var(--band);color:var(--ink)}
.btn.is-danger{color:var(--danger)}
.btn-primary.is-danger{background:var(--danger);color:var(--on-danger)}
.btn:active{transform:scale(.98)}
.link{display:inline-flex;align-items:center;gap:2px;min-height:44px;color:var(--ink);font-size:15px;line-height:20px;font-weight:600}
.link .ic{color:var(--ink-3)}
.link-center{justify-content:center;width:100%;font-size:17px;line-height:22px}
.link-small{min-height:44px;font-size:13px;margin-left:8px}
.i-chip{width:16px;height:16px;margin:0 6px 0 -4px}
.i-chip svg{stroke-width:2.6}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--ink-2);flex:none}
.icon-btn:active{background:var(--band)}
.bottom-action{position:sticky;bottom:0;padding:32px var(--m) calc(var(--safe-b) + 8px);
  background:linear-gradient(to bottom, transparent, var(--ground) 32px)}
.bottom-action.stack{display:grid;gap:8px}

/* ---------- header ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:15;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .18s ease-out, transform .18s ease-out, visibility 0s linear .18s}
#topbar.is-on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.topbar-in{position:relative;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%;max-width:520px;margin:0 auto;
  padding:max(env(safe-area-inset-top), 8px) 8px 4px;min-height:52px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2)}
.topbar-in::after,.wiz-head::after{content:"";position:absolute;left:0;right:0;top:100%;height:24px;pointer-events:none;
  background:linear-gradient(to bottom, var(--ground) 12px, transparent)}
.topbar-back{grid-column:1}
.topbar-title{grid-column:2;display:grid;justify-items:center;min-height:44px;align-content:center}
.topbar-title b{font-size:17px;line-height:22px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-title span{font-size:13px;line-height:18px;color:var(--ink-2)}
.head{padding:4px var(--m) 0}
.head-nav{margin:0 0 0 -12px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.head-row .i-chip{width:16px;height:16px;margin:0 6px 0 -4px}
.i-chip svg{stroke-width:2.6}
.icon-btn{margin-right:-10px}
.head-title{min-width:0}
.title-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;font:inherit;letter-spacing:inherit;text-align:left}
.title-btn .ic{color:var(--ink-3);margin-top:3px}
.head-sub{color:var(--ink-2);font-size:15px;line-height:20px;margin-top:2px}
.week{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin:-8px 0 -4px;color:var(--ink-2);font-size:15px;line-height:20px}
.week .ic{color:var(--ink-3)}
.head-page .head-title{margin-top:2px}

/* ---------- training list ---------- */
.list{padding:8px 0 0}
.ex{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 var(--m);text-align:left}
.ex .nm{flex:1;min-width:0;padding:12px 0;text-wrap:pretty}
.ex.done .nm{color:var(--ink-2)}
.ex:active{background:var(--band)}
.marks{display:flex;align-items:flex-end;gap:3px;height:24px;flex:none}
.marks b{display:block;width:3px;border-radius:2px;background:var(--ink-2)}
.marks i{display:block;width:4px;height:4px;border-radius:2px;background:var(--pending);margin-bottom:1px}

/* the current exercise is a full-width band of tone: no frame, no shadow */
.cur{background:var(--band);padding:12px 0 18px;margin:8px 0 4px}
.cur-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 var(--m)}
.cur-title{display:block;min-height:44px;padding:9px 0;text-align:left;min-width:0;text-wrap:balance;
  font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.cur-title .ic{display:inline-grid;vertical-align:-3px;color:var(--ink-3)}
.cur-tg{color:var(--ink-2);font-size:15px;line-height:20px;flex:none}

.set{display:grid;grid-template-columns:92px 1fr 44px;column-gap:8px;align-items:center;min-height:44px;padding:0 var(--m)}
.lab{color:var(--ink-2);font-size:15px;line-height:20px}
.lab-tag{color:var(--ink-3)}
.val{justify-self:start;min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:8px;text-align:left;font-weight:600}
.val small{font-size:13px;line-height:18px;font-weight:400;color:var(--ink-3)}
.set.todo .val{font-weight:400;color:var(--ink-3)}
.set.next .lab{color:var(--ink);font-weight:600}
.puck{width:44px;height:44px;display:grid;place-items:center;justify-self:end;margin-right:-10px;color:var(--ink)}
.puck.todo i{display:block;width:20px;height:20px;border-radius:10px;background:var(--pending)}
.puck:active{transform:scale(.9)}

/* the active set */
.act{padding:6px var(--m) 0}
.act-top{display:grid;grid-template-columns:92px 1fr;column-gap:8px;align-items:center;min-height:36px}
.act-top .lab{color:var(--ink);font-weight:600}
.prev{position:relative;isolation:isolate;justify-self:start;display:inline-flex;align-items:center;gap:6px;
  height:44px;margin:-4px 0 -4px -10px;padding:0 14px 0 10px;color:var(--ink-2);font-size:15px;line-height:20px;font-weight:600}
.prev::before{content:"";position:absolute;inset:4px 0;z-index:-1;border-radius:18px;background:var(--pocket)}
.prev .ic{color:var(--ink-3)}
.act-bar{margin:14px calc(-1 * var(--m))}
.bar-art{display:block;width:100%;height:auto;overflow:hidden}
.entry{display:flex;align-items:center;gap:8px;margin-top:14px}
.act-bar + .entry{margin-top:0}
.pocket{display:inline-flex;align-items:baseline;gap:4px;padding:8px 14px;border-radius:var(--r-field);background:var(--pocket);min-height:64px;min-width:64px;justify-content:center}
.fig{font-size:56px;line-height:52px;font-weight:800;letter-spacing:-.04em}
.fig.is-ghost{color:var(--ghost);font-weight:400;letter-spacing:-.03em}
.fig.is-long{font-size:48px;line-height:48px}
.unit{font-size:17px;line-height:22px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.times{font-size:28px;line-height:34px;color:var(--ink-3)}
.go{margin-left:auto;width:64px;height:64px;border-radius:32px;flex:none;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  transition:transform .12s ease-out}
.go:active{transform:scale(.94)}

/* ---------- the barbell ---------- */
.b-chrome{fill:var(--chrome)} .b-steel{fill:var(--steel)} .b-collar{fill:var(--steel-dark)}
.b-spent{fill:var(--shaft-spent)} .b-knurl{fill:var(--knurl-base)} .b-knurl-line{fill:var(--knurl-line)}
.b-p1{fill:var(--plate-1)} .b-p2{fill:var(--plate-2)} .b-p3{fill:var(--plate-3)} .b-p4{fill:var(--plate-4)}
.b-glint{fill:var(--glint);opacity:.2}
.b-slab{fill:var(--slab)} .b-ground{fill:var(--ground)} .b-pin{fill:var(--ink)}
.bar-art.is-ghost{--plate-1:var(--pending);--plate-2:var(--pending);--plate-3:var(--pending);--plate-4:var(--pending);--steel:var(--pending);--chrome:var(--slab);--steel-dark:var(--pending)}
.bar-art.is-ink{--plate-1:var(--ink);--plate-2:var(--ink-2);--plate-3:var(--ink-3);--plate-4:var(--pending)}
.stack-art{max-height:104px}
.plate{transform-box:view-box}
@media (prefers-reduced-motion: no-preference){
  .bar-art.unload .plate{animation:plate-off .24s cubic-bezier(.4,0,1,1) both;animation-delay:calc(var(--o) * 40ms)}
  .platform.enter .plate{animation:plate-on .5s var(--spring) both;animation-delay:calc(180ms + var(--i) * 50ms)}
  .platform.enter{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes plate-off{to{transform:translateX(calc(var(--s) * 26px));opacity:0}}
@keyframes plate-on{from{transform:translateX(calc(var(--s) * 34px));opacity:0}}
@keyframes rise{from{transform:translateY(16px) scale(.96);opacity:0}}

/* ---------- dock: session pill, rest platform, tab bar ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;pointer-events:none}
#dock.is-on{display:flex;flex-direction:column;gap:8px;padding:0 var(--m) var(--safe-b);max-width:520px;margin:0 auto}
#dock > *{pointer-events:auto}
.dock-fade{position:absolute;z-index:-1;pointer-events:none!important;left:0;right:0;bottom:0;top:-44px;
  background:linear-gradient(to bottom, transparent, var(--ground) 44px)}
#dock.is-resting .dock-fade{top:-56px}

.session{height:52px;border-radius:26px;background:var(--glass);color:var(--ink);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  display:flex;align-items:center;gap:14px;padding:0 4px 0 20px;box-shadow:0 8px 24px rgba(var(--shade),.10)}
.clock{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.02em;flex:none}
.rack{flex:1;min-width:0;display:flex;align-items:center}
.rack svg{display:block;width:100%;max-width:max-content;height:16px;overflow:visible}
.rk-d{fill:var(--ink)} .rk-now{fill:var(--accent)} .rk-todo{fill:var(--pending)}
.finish{height:44px;padding:0 16px;border-radius:22px;font-size:15px;line-height:20px;font-weight:600;color:var(--ink);flex:none}
.finish:active{background:var(--band)}

.platform{border-radius:var(--r-slab);background:var(--rubber);color:var(--on-rubber);padding:4px;
  box-shadow:0 14px 36px rgba(var(--shade),.22);
  --plate-1:var(--accent-on-rubber); --plate-2:#6A90F0; --plate-3:#7C9DF0; --plate-4:#A5BBF4;
  --chrome:#8C96A5; --steel-dark:#C7CED8; --steel:#6E7887; --knurl-base:#C9D0D9; --knurl-line:#5E6878; --shaft-spent:#39414D}
.pl-top{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 12px 0 16px}
.pl-time{font-size:72px;line-height:64px;font-weight:800;letter-spacing:-.045em}
.plus{height:44px;padding:0 18px;border-radius:22px;background:var(--on-rubber-fill);font-size:17px;line-height:22px;font-weight:600}
.pl-bar{margin:18px 16px 8px}
.pl-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:16px}
.nx{color:var(--on-rubber-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx b{color:var(--on-rubber);font-weight:600}
.skip{height:44px;padding:0 16px;border-radius:22px;font-weight:600;flex:none}
.skip:active,.plus:active{background:rgba(243,245,248,.2)}
.platform .skip,.platform .plus{color:var(--on-rubber)}

.tabbar{height:62px;border-radius:31px;display:flex;padding:4px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  box-shadow:0 8px 24px rgba(var(--shade),.10)}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--ink-2);font-size:11px;line-height:13px;font-weight:600;letter-spacing:0}
.tab .ic{width:26px;height:26px}
.tab .ic svg{stroke-width:1.6}
.tab.is-on{background:var(--tab-on);color:var(--ink);box-shadow:0 1px 3px rgba(var(--shade),.08)}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.is-open{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92svh;overflow:auto;
  background:var(--sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:8px var(--m) calc(var(--safe-b) + 8px);box-shadow:0 -12px 40px rgba(var(--shade),.12);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
@media (prefers-reduced-motion: no-preference){
  #sheet.is-open .sheet{animation:sheet-up .38s cubic-bezier(.2,.8,.2,1) both}
  #sheet.is-open .scrim{animation:fade .25s ease-out both}
}
@keyframes sheet-up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-only:focus-visible{position:static;width:auto;height:44px;margin:0 0 8px;clip:auto;overflow:visible;padding:0 12px;border-radius:22px;background:var(--key)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--grabber);margin:0 auto 14px}
.sheet-title{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.sheet-text{color:var(--ink-2);font-size:15px;line-height:20px;margin:4px 0 8px}
.confirm{display:grid;gap:8px;padding-bottom:4px}
.confirm .sheet-text{margin-bottom:12px}

.sh-head{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.sh-titles{display:flex;align-items:center;gap:6px;min-width:0;min-height:44px}
.sh-title{font-weight:600}
.sh-type{color:var(--ink-2)}
.type-btn .ic{color:var(--ink-3)}
.type-btn.is-open .ic{transform:rotate(180deg)}
.seg-types{margin-top:8px}
.sheet .option,.sheet .seg,.sheet .step{background:var(--key)}
.sheet .option.is-on{background:var(--sel)}
.sheet .prev{margin:0}
.sheet .prev::before{background:var(--key)}
.sh-value{display:flex;align-items:center;gap:10px;margin-top:12px}
.sh-value .pocket{background:var(--key);padding:12px 16px;min-height:88px;align-items:center}
.sh-value .pocket.is-focus{background:var(--accent-tint)}
.disp{font-size:72px;line-height:64px;font-weight:800;letter-spacing:-.045em}
.disp.is-ghost{color:var(--ghost);font-weight:400;letter-spacing:-.03em}
.disp.is-long{font-size:56px;line-height:56px}
.caret{width:3px;height:56px;border-radius:2px;background:var(--accent);margin:0 2px 0 1px;align-self:center}
@media (prefers-reduced-motion: no-preference){ .caret{animation:blink 1.1s steps(1) infinite} }
@keyframes blink{50%{opacity:0}}
.sh-value .unit{align-self:flex-end;margin-bottom:8px}
.sh-bar{margin:18px calc(-1 * var(--m)) 0}
.sheet-err{margin-top:8px}
.keys{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:52px;gap:8px}
.key{border-radius:var(--r-key);background:var(--key);display:grid;place-items:center;font-size:28px;line-height:34px;font-weight:400;letter-spacing:-.02em}
.key:active{background:var(--band)}
.key.fn{font-size:17px;line-height:22px;font-weight:600;color:var(--ink-2)}
.key.ret{grid-row:span 2;background:var(--ret);color:var(--on-ret);font-size:17px;line-height:22px;font-weight:600;padding:0 6px;text-align:center}
.key.is-blank{background:none}
.key .ic{width:26px;height:26px}
.finder .field{margin-top:18px}
.finder .btn{margin-top:16px}

.picker .options{margin-top:12px}
.week-step{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.week-step-label{display:grid;justify-items:center}
.week-step-label span{color:var(--ink-2);font-size:15px;line-height:20px}

/* ---------- forms: options, chips, segmented, number fields ---------- */
.wiz-head{position:sticky;top:0;z-index:5;isolation:isolate;display:flex;align-items:center;gap:12px;padding:4px var(--m) 4px calc(var(--m) - 12px);min-height:52px;
  margin-top:calc(-1 * max(env(safe-area-inset-top), 12px));padding-top:calc(max(env(safe-area-inset-top), 12px) + 4px);
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2)}
.progress{flex:1;height:4px;border-radius:2px;background:var(--band);overflow:hidden;margin-right:var(--m)}
.progress i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.progress-spacer{flex:1}
.wiz-title{padding:20px var(--m) 0}
.wiz-lead{padding:8px var(--m) 0;color:var(--ink-2);font-size:15px;line-height:20px;max-width:34em}
.wiz-body{padding:24px var(--m) 24px;display:grid;gap:28px}

.options{display:grid;gap:8px}
.option{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 18px;
  border-radius:var(--r-field);background:var(--band);text-align:left;font-weight:600}
.option-meta{color:var(--ink-2);font-weight:400;font-size:15px;line-height:20px;text-align:right}
.option.is-on{background:var(--sel)}
.option-tick{color:var(--ink);margin-left:-4px}
.option:active{transform:scale(.985)}


.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--band);font-size:15px;line-height:20px;font-weight:600}
.chip{display:inline-flex;align-items:center}
.chip.is-on{background:var(--sel)}

.field{display:grid;gap:10px}
.field-label{color:var(--ink-2);font-size:15px;line-height:20px}
.field-error{color:var(--danger);font-size:15px;line-height:20px}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--band)}
.seg-item{flex:1;min-height:44px;border-radius:11px;font-weight:600;font-size:15px;line-height:20px;color:var(--ink-2);padding:0 6px}
.seg-item.is-on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(var(--shade),.12)}

.num-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num-field{display:grid;gap:8px}
.num-wrap{display:flex;align-items:baseline;gap:4px;min-height:64px;padding:10px 14px;border-radius:var(--r-field);background:var(--band);cursor:text}
.num-wrap:focus-within{background:var(--accent-tint)}
.num-input{width:100%;min-width:0;border:1px solid transparent;background:none;padding:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.025em;caret-color:var(--accent)}
.num-input:focus{outline:none}
.num-input::placeholder{color:var(--ghost);font-weight:400}
.num-unit{color:var(--ink-2);font-size:15px;line-height:20px;font-weight:600}
.num-field.is-error .num-wrap{background:color-mix(in srgb, var(--danger) 10%, var(--band))}

/* ---------- pages ---------- */
.group{padding:24px var(--m) 0;display:grid;gap:10px}
.group-actions{padding-top:32px;gap:8px}
.rows{display:grid;margin:0 calc(-1 * var(--m))}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px var(--m);text-align:left;width:100%}
button.row:active{background:var(--band)}
.row-label{flex:1;min-width:0;display:grid}
.row-label small,.row-value small{color:var(--ink-3);font-size:13px;line-height:18px;font-weight:400}
.row-value{color:var(--ink-2);text-align:right;display:grid;justify-items:end;font-weight:600}
.row-delta{color:var(--ink-3);font-size:15px;line-height:20px;flex:none}
.about{padding:20px var(--m) 0}
.hero{display:grid;gap:2px;width:100%;padding:20px var(--m) 8px;text-align:left}
.hero-name,.sum-record .hero-name{font-weight:600}
.hero-num{font-size:56px;line-height:56px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
.hero-unit{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em;color:var(--ink-2)}
.hero-sub{color:var(--ink-2);font-size:15px;line-height:20px}
.hero-art{display:block;margin:24px calc(-1 * var(--m)) 8px}
.hero-cap{color:var(--ink-3);font-size:13px;line-height:18px}
.hero .hero-cap{padding:0}
.sum-record{display:grid;gap:2px;margin-top:40px}
.summary .sum-line{margin-top:0}
.summary .sum-bar{margin-top:24px}
.summary .sum-next{margin-top:32px}
.row .ic{color:var(--ink-3);margin-right:-6px}
.row-sets{font-weight:400;font-size:15px;line-height:20px;text-wrap:balance}
.facts{padding:16px var(--m) 0;display:grid;gap:2px}
.fact{display:flex;justify-content:space-between;gap:16px;min-height:40px;align-items:center}
.fact dt{color:var(--ink-2)}
.fact dd{font-weight:600;text-align:right}
.prose{padding:24px var(--m) 0;display:grid;gap:10px;max-width:40em}
.prose p{color:var(--ink-2)}
.prose h3{font-size:17px;line-height:22px;font-weight:600;margin-top:6px}
.cue{padding:16px var(--m) 0;color:var(--ink-2)}
.empty{padding:32px var(--m);display:grid;gap:20px;color:var(--ink-2)}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.stepper-label{display:flex;align-items:center;flex-wrap:wrap}
.stepper-ctl{display:flex;align-items:center;gap:6px}
.stepper-val{min-width:64px;text-align:center;font-weight:600}
.step{width:44px;height:44px;border-radius:22px;background:var(--band);display:grid;place-items:center}
.step .ic{width:20px;height:20px}
.step .ic svg{stroke-width:2}

.phases{display:grid;gap:4px}
.phase{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;align-items:baseline}
.phase-weeks{color:var(--ink-3);font-weight:600}
.phase p{color:var(--ink-2);font-size:15px;line-height:20px}
.phase.is-past b,.phase.is-past .phase-weeks{color:var(--ink-3)}
.phase.is-on{background:var(--band);margin:0 calc(-1 * var(--m));padding:10px var(--m)}
.phase.is-on .phase-weeks{color:var(--ink)}
.day-plan{display:grid;gap:4px;padding:8px 0}
.day-plan h3{font-size:17px;line-height:22px;font-weight:600}
.day-plan li{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2);font-size:15px;line-height:20px;padding:3px 0}
.day-plan li b{font-weight:400;flex:none}
.volume{display:grid;gap:6px}
.vol{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;min-height:28px}
.vol-name{color:var(--ink-2);font-size:15px;line-height:20px}
.vol-bar{height:6px;border-radius:3px;background:var(--band);overflow:hidden}
.vol-bar i{display:block;height:100%;background:var(--ink-2);transform-origin:left}
.vol-n{text-align:right;font-weight:600}

.chart-wrap{margin:0 -4px}
.chart{display:block;width:100%;height:auto}
.chart-area{fill:var(--band)}
.chart-line{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{fill:var(--ink-2)}
.chart-pr{fill:var(--ink)}
.chart-x,.chart-y{fill:var(--ink-3);font-size:11px;font-family:var(--font)}

.weeks{display:flex;align-items:flex-end;padding:20px var(--m) 0;gap:6px;margin:0}
.wk{display:grid;justify-items:center;gap:6px}
.wk.gap{margin-left:8px}
.wk i{display:block;width:4px;border-radius:2px;background:var(--pending)}
.wk.is-past i,.wk.is-now i{background:var(--ink)}
.wk small{font-size:13px;line-height:18px;color:var(--ink-3)}
.wk.is-now small{color:var(--ink);font-weight:600}
.weeks-cap{padding:6px var(--m) 0;color:var(--ink-3);font-size:13px;line-height:18px}

/* food */
.kcal{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:8px;width:100%;padding:20px var(--m) 4px;text-align:left}
.kcal-num{font-size:56px;line-height:52px;font-weight:800;letter-spacing:-.04em}
.kcal-unit{font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px}
.kcal-unit .ic{color:var(--ink-3)}
.macros{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;color:var(--ink-2);font-size:15px;line-height:20px}
.macros b{color:var(--ink);font-weight:600}
.notes{padding:12px var(--m) 0;display:grid;gap:6px}
.note{color:var(--ink);font-size:15px;line-height:20px}
.meals{padding:16px 0 0}
.meal{padding:16px var(--m)}
.meal.is-open{background:var(--band);margin:4px 0}
.meal-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:14px var(--m);text-align:left}
.meal-row:active{background:var(--band)}
.meal-row .meal-name{font-size:17px;line-height:22px}
.meal-row .meal-kcal{color:var(--ink-3)}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.meal-name{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.meal-kcal{color:var(--ink-2);font-size:15px;line-height:20px}
.meal-items li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--ink-2)}
.meal-items b{color:var(--ink);font-weight:600;flex:none}
.view-food > .btn,.view-ex > .btn{width:calc(100% - 2 * var(--m));margin:16px var(--m) 0}
.btn .ic{width:20px;height:20px}

/* summary */
.summary{padding:28px var(--m) 24px;display:grid;gap:8px}
.sum-kicker{color:var(--ink-2);font-size:15px;line-height:20px}
.sum-line{color:var(--ink-2)}
.sum-bar{margin:20px calc(-1 * var(--m)) 0}
.sum-bar figcaption{padding:8px var(--m) 0;color:var(--ink-3);font-size:13px;line-height:18px}
.sum-more{margin:8px 0 0}
.sum-bar b{color:var(--ink);font-weight:600}
.sum-next{margin-top:16px;color:var(--ink-2)}
.sum-next b{color:var(--ink);font-weight:600}

/* welcome and red flag */
.welcome{min-height:calc(100svh - 160px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px var(--m)}
.welcome-name{font-size:56px;line-height:52px;font-weight:800;letter-spacing:-.04em}
.welcome-bar{margin:0 calc(-1 * var(--m))}
.welcome-line{color:var(--ink-2);max-width:20em;text-wrap:pretty}
.redflag{padding:20px 0 0}
.redflag .wiz-title{padding-top:12px}
.flag-list{padding:16px var(--m) 0;display:grid;gap:6px}
.flag-list li{font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(var(--dock) + 12px);z-index:50;transform:translate(-50%,8px);opacity:0;pointer-events:none;
  background:var(--rubber);color:var(--on-rubber);padding:10px 16px;border-radius:20px;font-size:15px;line-height:20px;
  transition:opacity .2s cubic-bezier(.2,.8,.2,1), transform .2s cubic-bezier(.2,.8,.2,1)}
#toast.is-show{opacity:1;transform:translate(-50%,0)}
#toast.is-sticky{width:calc(100% - 2 * var(--m));max-width:480px;text-align:center}

/* Windows high contrast: controls get their outlines back */
@media (forced-colors: active){
  .go,.pocket,.option,.chip,.seg-item.is-on,.key,.tab.is-on,.btn{border-color:ButtonText}
  .puck.todo i,.marks b,.marks i{background:CanvasText}
  .rk-d,.rk-todo{fill:CanvasText}
  .rk-now{fill:Highlight}
  .session,.platform,.tabbar,.topbar-in,.sheet{background:Canvas;border:1px solid CanvasText}
  .dock-fade{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-property:opacity!important;transition-duration:150ms!important}
}

/* ---------- ask ---------- */
.head-acts{display:flex;align-items:center;gap:4px}
.head-acts .icon-btn:not(:last-child){margin-right:0}
.ask-link{padding:4px var(--m) 0}
.chip-icon{gap:6px}
.chip-icon .i-chip{width:18px;height:18px;margin:0}
#app.view-ask{min-height:100svh;display:flex;flex-direction:column}
.chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:20px var(--m) 8px}
.chat .chip{text-align:left}
.msg{max-width:100%;white-space:pre-line;overflow-wrap:anywhere}
.msg-u{align-self:flex-end;max-width:82%;display:grid;gap:6px;justify-items:end}
.msg-u p{background:var(--band);padding:10px 14px;border-radius:var(--r-field)}
.msg-img{display:block;max-width:220px;max-height:260px;border-radius:var(--r-field);object-fit:cover}
.msg-m{color:var(--ink)}
.msg-wait{color:var(--ink-3);font-size:28px;line-height:22px;font-weight:600}
.msg-err{color:var(--danger);font-size:15px;line-height:20px}
/* Above the whole dock, so the dock fade does not wash over it. */
.ask-bar{position:sticky;bottom:calc(var(--dock) + 10px);z-index:21;margin:8px 12px 0;padding:6px;border-radius:var(--r-slab);
  background:var(--pocket);box-shadow:0 8px 28px rgba(var(--shade),.12),0 1px 3px rgba(var(--shade),.06);display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.ask-row{display:flex;align-items:flex-end;gap:4px}
.ask-row .icon-btn{margin:0}
.ask-input{flex:1;width:0;min-width:0;min-height:44px;max-height:132px;resize:none;border:1px solid transparent;background:none;
  padding:11px 4px;font:inherit;color:inherit;letter-spacing:inherit;line-height:22px;caret-color:var(--accent)}
.ask-input:focus{outline:none}
.ask-input::placeholder{color:var(--ghost)}
.send{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none;background:var(--ink);color:var(--ground)}
.send .ic svg{stroke-width:2.2}
.send:disabled{background:var(--band);color:var(--ink-3);opacity:1}
.att{position:relative;justify-self:start;margin:10px 0 0 6px}
.att img{display:block;width:72px;height:72px;border-radius:var(--r-key);object-fit:cover}
.att-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;display:grid;place-items:center;
  background:var(--ink);color:var(--ground)}
.att-x .ic{width:14px;height:14px}
.chip-icon .i-chip svg{stroke-width:2}
.att-x::before{content:"";position:absolute;inset:-10px}
</style>
</head>
<body>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<div id="topbar" aria-hidden="true"></div>
<main id="app"></main>
<div id="dock"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var FORGE=(function(){
"use strict";

const MUSCLES = ["chest","lats","upback","sdelt","rdelt","biceps","triceps","quads","hams","glutes","calves","traps","core"];

const MUSCLE_RU = {
  chest:"Грудь", lats:"Широчайшие", upback:"Верх спины", sdelt:"Средние дельты",
  rdelt:"Задние дельты", biceps:"Бицепс", triceps:"Трицепс", quads:"Квадрицепс",
  hams:"Бицепс бедра", glutes:"Ягодицы", calves:"Икры", traps:"Трапеции", core:"Пресс"
};

const BASE_VOL = {
  chest:14, lats:14, upback:10, sdelt:14, rdelt:8, biceps:10, triceps:10,
  quads:14, hams:10, glutes:10, calves:10, traps:6, core:8
};

const GROUP = {
  push: ["chest","sdelt","triceps"],
  pull: ["lats","upback","rdelt","biceps","traps"],
  legs: ["quads","hams","glutes","calves"],
  core: ["core"]
};
const UPPER = [].concat(GROUP.push, GROUP.pull);
const ALL = [].concat(UPPER, GROUP.legs, GROUP.core);

const EX = [
  {id:"inc_db_press", n:"Жим гантелей на наклонной 30°", m:"chest", sec:["fdelt","triceps"], eq:["db"], t:"comp", pat:"hpress", stretch:true, cue:"Локти ~45°, растяжение внизу"},
  {id:"flat_bb_bench", n:"Жим штанги лёжа", m:"chest", sec:["fdelt","triceps"], eq:["bb"], t:"comp", pat:"hpress", cue:"Лопатки сведены, ноги в пол"},
  {id:"flat_db_press", n:"Жим гантелей лёжа", m:"chest", sec:["fdelt","triceps"], eq:["db"], t:"comp", pat:"hpress", stretch:true, cue:"Глубокое растяжение"},
  {id:"dip", n:"Отжимания на брусьях", m:"chest", sec:["triceps"], eq:["bw"], t:"comp", pat:"dip", stretch:true, cue:"Наклон корпуса вперёд на грудь"},
  {id:"cable_fly", n:"Сведения в кроссовере снизу-вверх", m:"chest", eq:["cable"], t:"iso", pat:"fly", stretch:true, cue:"К верху груди, сжатие 1 сек"},
  {id:"pecdeck", n:"Бабочка (пек-дек)", m:"chest", eq:["machine"], t:"iso", pat:"fly", cue:"Полное сведение"},

  {id:"pullup", n:"Подтягивания", m:"lats", sec:["biceps","upback"], eq:["bw"], t:"comp", pat:"vpull", stretch:true, cue:"Полная амплитуда, свод лопаток"},
  {id:"lat_pulldown", n:"Тяга верхнего блока", m:"lats", sec:["biceps"], eq:["cable"], t:"comp", pat:"vpull", stretch:true, cue:"Тяни локтями вниз"},
  {id:"pullover", n:"Пуловер на блоке", m:"lats", eq:["cable"], t:"iso", pat:"pullover", stretch:true, cue:"Растяжение широчайших вверху"},

  {id:"barbell_row", n:"Тяга штанги в наклоне", m:"upback", sec:["lats","biceps"], eq:["bb"], t:"comp", pat:"hpull", cue:"Спина ровная, тяни к поясу"},
  {id:"chest_row", n:"Тяга гантели в упоре (грудь в лавку)", m:"upback", sec:["lats"], eq:["db"], t:"comp", pat:"hpull", cue:"Корпус зафиксирован"},

  bro_ant: {ru:"Сплит: грудь+бицепс / спина+трицепс", byDays:true,                        minDays:3, maxDays:6},
  bro_syn: {ru:"Сплит: грудь+трицепс / спина+бицепс", byDays:true,                        minDays:3, maxDays:6},
  full:  {ru:"Фулбади",         parts:[["full","Всё тело"]],                             minDays:2, maxDays:4},
  ul:    {ru:"Верх / Низ",       parts:[["upper","Верх"],["lower","Низ"]],                minDays:2, maxDays:6},
  ppl:   {ru:"Пуш / Пул / Ноги", parts:[["push","Жим"],["pull","Тяга"],["legs","Ноги"]],  minDays:3, maxDays:6},
  upper: {ru:"Только верх",      parts:[["upper","Верх"]],                                minDays:2, maxDays:6}
};

function splitOptionsFor(days, legs){
  const out = ["auto"];
  Object.keys(SPLIT_TPL).forEach(k=>{
    const t = SPLIT_TPL[k];
    if(days < t.minDays || days > t.maxDays) return;
    if(t.byDays){
      const tables = BRO_TABLES[k];
      if(!tables) return;
      const table = legs ? tables.legs : tables.upper;
      if(!table || !table[days]) return;
      out.push(k);
      return;
    }
    if(!legs && k !== "upper") return;
    if(legs && k === "upper") return;
    out.push(k);
  });
  return out;
}

// Muscles of each day type, shared by the templates and the auto split.
const PARTS = { upper: UPPER.concat("core"), lower: GROUP.legs, full: ALL, push: GROUP.push, pull: GROUP.pull.concat("core"), legs: GROUP.legs };

function buildFromTemplate(pref, days, legs){
  const t = SPLIT_TPL[pref];
  if(!t) return null;
  if(t.byDays){
    const tables = BRO_TABLES[pref];
    if(!tables) return null;
    const table = legs ? tables.legs : tables.upper;
    const rows = table && table[days];
    if(!rows) return null;
    return {name: t.ru + " · " + days + " дн/нед",
            days: rows.map(r=>({name:r[0], muscles:r[1].slice()}))};
  }
  const seq = [];
  const seen = {};
  for(let i=0;i<days;i++){
    const part = t.parts[i % t.parts.length];
    const key = part[0];
    seen[key] = (seen[key]||0) + 1;
    const many = days > t.parts.length;
    const label = part[1] + (many ? " " + "АБВГДЕ".charAt(seen[key]-1) : "");
    seq.push({name: label, muscles: (PARTS[key]||ALL).slice()});
  }
  const label = (days % t.parts.length === 0)
    ? t.ru + " ×" + (days / t.parts.length)
    : t.ru + " · " + days + " дн/нед";
  return {name: label, days: seq};
}

function chooseSplit(days, legs, pref){
  if(pref && pref!=="auto" && splitOptionsFor(days, legs).indexOf(pref)>=0){
    const built = buildFromTemplate(pref, days, legs);
    if(built) return built;
  }
  let seq;
  if(!legs){
    const u=(k)=>({name:"Верх "+k, muscles:UPPER.concat("core")});
    if(days<=2) seq=[u("А"),u("Б")];
    else if(days===3) seq=[u("А"),u("Б"),u("В")];
    else if(days===4) seq=[u("А"),u("Б"),u("А2"),u("Б2")];
    else if(days===5) seq=[u("А"),u("Б"),u("А2"),u("Б2"),u("В")];
    else seq=[u("А"),u("Б"),u("А2"),u("Б2"),u("А3"),u("Б3")];
    return {name:"Только верх ×"+days, days:seq};
  }
  const mk=(key,label)=>({name:label, muscles:PARTS[key].slice()});
  if(days<=2){ seq=[mk("full","Всё тело А"),mk("full","Всё тело Б")]; return splitName("Фулбади ×2",seq); }
  if(days===3){ seq=[mk("full","Всё тело А"),mk("full","Всё тело Б"),mk("full","Всё тело В")]; return splitName("Фулбади ×3",seq); }
  if(days===4){ seq=[mk("upper","Верх А"),mk("lower","Низ А"),mk("upper","Верх Б"),mk("lower","Низ Б")]; return splitName("Верх/Низ ×2",seq); }
  if(days===5){ seq=[mk("push","Жим (пуш)"),mk("pull","Тяга (пул)"),mk("legs","Ноги"),mk("upper","Верх"),mk("lower","Низ")]; return splitName("Пуш/Пул/Ноги + Верх/Низ",seq); }
  seq=[mk("push","Жим А"),mk("pull","Тяга А"),mk("legs","Ноги А"),mk("push","Жим Б"),mk("pull","Тяга Б"),mk("legs","Ноги Б")];
  return splitName("Пуш/Пул/Ноги ×2",seq);
}
function splitName(name,days){ return {name, days}; }

function weeklyVolume(input){
  const expMul = {beg:0.7, int:1.0, adv:1.15}[input.level] || 1.0;
  const vol = {};
  MUSCLES.forEach(m=>{
    let base = BASE_VOL[m]*expMul;
    if(input.goal==="str") base *= 0.75;
    if(input.goal==="cut") base *= 0.9;
    if(input.emphasis && input.emphasis.indexOf(m)>=0) base *= 1.4;
    if(input.exclude && input.exclude.indexOf(m)>=0) base = 0;
    if(!input.legs && GROUP.legs.indexOf(m)>=0) base = 0;
    vol[m] = base>0 ? clamp(round(base),4,26) : 0;
  });
  return vol;
}

function sessionCap(minutes){
  if(minutes<=45) return 14;
  if(minutes<=60) return 18;
  if(minutes<=75) return 22;
  return 26;
}

function maxExercises(minutes, level){
  let n = minutes<=45?4 : minutes<=60?5 : minutes<=75?6 : 7;
  if(level==="beg") n = Math.min(n, 5);
  return n;
}

function repScheme(goal, ex, isMain){
  if(goal==="str"){
    if(ex.t==="comp" && isMain) return {reps:"3–5", rir:"2"};
    if(ex.t==="comp") return {reps:"5–8", rir:"2"};
    return {reps:"6–10", rir:"1–2"};
  }
  if(goal==="hybrid"){
    if(ex.t==="comp" && isMain) return {reps:"4–6", rir:"2"};
    if(ex.t==="comp") return {reps:"6–10", rir:"1–2"};
    return {reps:"10–15", rir:"0–1"};
  }
  if(goal==="cut"){
    if(ex.t==="comp" && isMain) return {reps:"5–8", rir:"2"};
    if(ex.t==="comp") return {reps:"6–10", rir:"2"};
    return {reps:"12–20", rir:"0–1"};
  }
  if(ex.t==="comp") return {reps:"6–10", rir:"1–2"};
  return {reps:"10–15", rir:"0–1"};
}

// How many exercises a muscle's sets for one session are split into.
function exCount(nsets){ return nsets<=5?1 : nsets<=9?2 : 3; }

// pool holds only safe moves for this muscle (banned ones never come back).
// One exercise per movement pattern; the sets are split over the exercises actually chosen.
function pickExercises(pool, nsets, nEx, usedPat, goal, rot, first){
  const score = (e)=> (e.t==="comp"?2:0) + (e.stretch?1:0);
  pool = pool.slice().sort((a,b)=> score(b)-score(a));
  if(rot && pool.length>1){
    const k = rot % pool.length;
    pool = pool.slice(k).concat(pool.slice(0,k));
  }
  if(first) pool.sort((a,b)=> (b.id===first)-(a.id===first));
  const chosen=[];
  for(const e of pool){
    if(chosen.length>=nEx) break;
    if(usedPat.has(e.pat)) continue;
    usedPat.add(e.pat);
    chosen.push(e);
  }
  if(!chosen.length && pool.length) chosen.push(pool[0]);
  return chosen.map((e,i)=>{
    const rs = repScheme(goal, e, i===0 && e.t==="comp");
    const sets = clamp(Math.floor(nsets/chosen.length) + (i < nsets%chosen.length ? 1 : 0), 2, 5);
    return {id:e.id, name:e.n, muscle:e.m, sets, reps:rs.reps, rir:rs.rir, cue:e.cue, stretch:!!e.stretch, type:e.t, eq:e.eq.slice()};
  });
}

function generateProgram(input){
  input = Object.assign({level:"int", days:4, minutes:75, goal:"hyp", legs:true, emphasis:[], exclude:[]}, input||{});
  input.days = clamp(input.days,2,6);
  const split = chooseSplit(input.days, input.legs, input.split);
  const vol = weeklyVolume(input);
  const cap = sessionCap(input.minutes);
  const maxEx = maxExercises(input.minutes, input.level);
  const priority = ["quads","chest","lats","upback","hams","glutes","sdelt","triceps","biceps","rdelt","calves","traps","core"];
  const eqSet = new Set(input.equipment && input.equipment.length ? input.equipment : ["bb","db","cable","machine","bw"]);
  const lims = (input.limits||[]).map(k=>LIMITS[k]).filter(Boolean);
  const banned = new Set();
  lims.forEach(L=> L.ban.forEach(id=>banned.add(id)));

  // Safe moves per muscle. A muscle takes one exercise per movement pattern, three at most.
  const pool = {}, pats = {};
  MUSCLES.forEach(m=>{
    pool[m] = EX.filter(e=> e.m===m && e.eq.some(x=>eqSet.has(x)) && !banned.has(e.id));
    pats[m] = Math.min(3, new Set(pool[m].map(e=>e.pat)).size);
  });
  const live = (m)=> vol[m]>0 && pats[m]>0;
  const listed = split.days.map(d=> priority.filter(m=> d.muscles.indexOf(m)>=0 && live(m)));

  // A limit can require a move twice a week (face pull for shoulders): add its muscle to more days,
  // upper-body days with the fewest muscles first.
  const must = {};
  lims.forEach(L=>{
    const e = L.must && EX.filter(x=> x.id===L.must)[0];
    if(!e || !live(e.m) || pool[e.m].indexOf(e)<0) return;
    must[e.m] = e.id;
    const legDay = (i)=> listed[i].some(m=> UPPER.indexOf(m)>=0) ? 0 : 1;
    let n = listed.filter(ms=> ms.indexOf(e.m)>=0).length;
    listed.map((ms,i)=>i).filter(i=> listed[i].indexOf(e.m)<0)
      .sort((a,b)=> legDay(a)-legDay(b) || listed[a].length-listed[b].length)
      .forEach(i=>{ if(n<2){ listed[i] = priority.filter(m=> m===e.m || listed[i].indexOf(m)>=0); n++; } });
  });

  // 1. Muscles per session. Past the exercise cap the top three (and required ones) stay;
  // the other slots go to the muscles trained on the fewest days so far.
  const got = {};
  const plan = listed.map(ms=>{
    if(ms.length > maxEx){
      const head = ms.filter(m=> must[m]);
      ms.forEach(m=>{ if(head.length < Math.min(3, maxEx) && head.indexOf(m)<0) head.push(m); });
      const tail = ms.filter(m=> head.indexOf(m)<0).sort((a,b)=> (got[a]||0)-(got[b]||0));
      const picked = head.concat(tail).slice(0, maxEx);
      ms = ms.filter(m=> picked.indexOf(m)>=0);
    }
    ms.forEach(m=> got[m] = (got[m]||0)+1);
    return ms;
  });

  // 2. Sets: the weekly target spread over those sessions, then fitted into each session:
  // spare exercise slots go to muscles with many sets, 5 sets per exercise, then the set cap.
  const sum = (w)=> Object.keys(w).reduce((a,m)=> a+w[m], 0);
  const sess = plan.map(ms=>{
    const w = {}, slot = {};
    ms.forEach(m=>{ w[m] = Math.max(2, round(vol[m]/got[m])); slot[m] = 1; });
    let free = maxEx - ms.length, more = true;
    while(free>0 && more){
      more = false;
      ms.forEach(m=>{ if(free>0 && slot[m] < Math.min(pats[m], exCount(w[m]))){ slot[m]++; free--; more = true; } });
    }
    ms.forEach(m=>{ w[m] = Math.min(w[m], 5*slot[m]); });
    if(sum(w) > cap){
      const scale = cap/sum(w);
      ms.forEach(m=>{ w[m] = Math.max(2, round(w[m]*scale)); });
      // Trim the biggest; on a tie the lower-priority muscle gives up the set.
      let guard = 0;
      while(sum(w) > cap && guard++ < 100){
        let big = null;
        ms.forEach(m=>{ if(w[m] > 2 && (!big || w[m] >= w[big])) big = m; });
        if(!big) break;
        w[big] -= 1;
      }
    }
    return {w, slot};
  });

  // 3. Sets the caps cut go to other sessions of the same muscle that still have room,
  // the muscle furthest below its target first.
  const total = (m)=> sess.reduce((a,s)=> a+(s.w[m]||0), 0);
  const fits = (s,m)=> s.w[m]!=null && sum(s.w) < cap &&
    (s.w[m] < 5*s.slot[m] || (s.slot[m] < pats[m] && sum(s.slot) < maxEx));
  for(let guard=0; guard<500; guard++){
    let best = null;
    MUSCLES.forEach(m=>{
      const r = (vol[m]-total(m))/vol[m];
      if(!(r>0) || (best && r <= best.r)) return;
      const ss = sess.filter(s=> fits(s,m)).sort((a,b)=> a.w[m]-b.w[m] || sum(a.w)-sum(b.w));
      if(ss.length) best = {m, r, s:ss[0]};
    });
    if(!best) break;
    const s = best.s, m = best.m;
    if(s.w[m] >= 5*s.slot[m]) s.slot[m]++;
    s.w[m]++;
  }

  // 4. Exercises.
  const days = split.days.map((d, di)=>{
    const usedPat = new Set();
    const items = [];
    plan[di].forEach(m=>{
      const w = sess[di].w[m];
      pickExercises(pool[m], w, Math.min(sess[di].slot[m], exCount(w)), usedPat, input.goal, di, must[m]).forEach(x=> items.push(x));
    });
    lims.forEach(L=> items.forEach(x=>{
      if(L.edit && L.edit[x.id]) Object.assign(x, L.edit[x.id]);
      if(L.reps && L.reps[x.muscle]) x.reps = L.reps[x.muscle];
    }));
    return {key:d.name, name:d.name, exercises:items};
  });

  const achieved = {};
  MUSCLES.forEach(m=> achieved[m]=0);
  days.forEach(d=> d.exercises.forEach(x=> achieved[x.muscle]+=x.sets));
  const skipped = MUSCLES.filter(m=> vol[m]>0 && !pats[m]);
  // Under 70% of the target: the sessions had no room for more.
  const shortfall = MUSCLES.filter(m=> vol[m]>0 && pats[m] && achieved[m] < 0.7*vol[m]);

  return {
    meta:{split:split.name, days:input.days, goal:input.goal, level:input.level, minutes:input.minutes, legs:input.legs},
    days,
    weeklyVolume:achieved,
    target:vol,
    progression: input.goal==="str"
      ? "Все подходы сделаны в верхе диапазона и в запасе ещё 2 повтора — добавь 2,5 кг на базе. В подсобке сначала добавляй повторы, потом вес."
      : input.goal==="cut"
      ? "Держи прежние веса на базе. Если вес на штанге падает две тренировки подряд, уменьши дефицит в еде, а не подходы."
      : "Добавляй по повтору в рамках диапазона. Выбил верх во всех подходах — прибавь вес: 2,5 кг на базе, 1–2 кг на изоляции.",
    skipped,
    shortfall,
    notes: buildNotes(input, shortfall, achieved, vol),
    limitNotes: (input.limits||[]).map(k=> LIMITS[k] ? {title:LIMITS[k].ru, note:LIMITS[k].note} : null).filter(Boolean)
  };
}

function buildNotes(input, shortfall, achieved, target){
  const notes=[];
  if(!input.legs) notes.push("Ноги исключены: программа только на верх.");
  if(shortfall.length) notes.push("Меньше нормы подходов в неделю: "+
    shortfall.map(m=> MUSCLE_RU[m].toLowerCase()+" "+achieved[m]+" из "+target[m]).join(", ")+".");
  // The same words the questionnaire used for these choices.
  const EMPH_RU={chest:"грудь", lats:"спина", sdelt:"плечи", biceps:"бицепс", triceps:"трицепс", quads:"ноги", glutes:"ягодицы", core:"пресс"};
  const emph=(input.emphasis||[]).map(m=>EMPH_RU[m]||MUSCLE_RU[m]).filter(Boolean);
  if(emph.length) notes.push("Акцент: "+emph.join(", ")+". Объём на них выше.");
  notes.push(input.goal==="str"?"Сила: мало повторов на базе, отдых 3–5 минут, техника важнее веса."
    : input.goal==="hybrid"?"Сила и масса: тяжёлая база на 4–6 повторов и подсобка на рост мышц."
    : input.goal==="cut"?"Сушка: база остаётся тяжёлой, 5–8 повторов, чтобы сохранить мышцы. Изоляция на 12–20 повторов. Объём чуть ниже: в дефиците восстановление хуже."
    : "Масса: 6–15 повторов, отдых 1,5–3 минуты.");
  if(input.goal==="cut"){
    notes.push("Кардио: 2–3 раза по 20–30 минут или 8–10 тысяч шагов в день. Дефицит в еде оно не заменяет.");
    notes.push("Сушка идёт правильно, если вес тела падает, а веса на штанге держатся.");
  }
  return notes;
}

function clamp(x,a,b){ return Math.max(a, Math.min(b,x)); }
function r(x){ return Math.round(x); }

function bmr(input){
  const s = input.sex==="f" ? -161 : 5;
  if(input.bodyfat && input.bodyfat>3 && input.bodyfat<60){
    const lbm = input.weight*(1-input.bodyfat/100);
    return {value: 370 + 21.6*lbm, formula:"Кетч-МакАрдл (по % жира)"};
  }
  return {value: 10*input.weight + 6.25*input.height - 5*input.age + s, formula:"Миффлина–Сан Жеора"};
}

const ACTIVITY = {
  sed:   {mul:1.2,   ru:"Сидячий образ жизни"},
  light: {mul:1.375, ru:"Лёгкая активность (1–3 трен/нед)"},
  mod:   {mul:1.55,  ru:"Средняя (3–5 трен/нед)"},
  high:  {mul:1.725, ru:"Высокая (6–7 трен/нед)"},
  ath:   {mul:1.9,   ru:"Очень высокая (физическая работа + спорт)"}
};

// Lifestyle outside the gym; training sessions are added on top (≈+0.025 per weekly session).
const LIFESTYLE = {
  sed:   {mul:1.25, ru:"Сидячая работа"},
  light: {mul:1.35, ru:"Немного хожу"},
  mod:   {mul:1.45, ru:"Много хожу"},
  high:  {mul:1.6,  ru:"Физический труд"}
};

function activityFactor(input){
  const life = LIFESTYLE[input.activity];
  if(life && typeof input.trainingDays==="number"){
    const d = clamp(Math.round(input.trainingDays),0,7);
    var word = (d>=2 && d<=4) ? "раза" : "раз";
    return {mul: Math.min(1.9, life.mul + 0.025*d), ru: life.ru+", "+d+"\u00a0"+word+" в\u00a0неделю"};
  }
  return ACTIVITY[input.activity] || ACTIVITY.light;
}

function energy(input){
  const b = bmr(input);
  const act = activityFactor(input);
  const tdee = b.value*act.mul;
  let target, rate, label;
  switch(input.goal){
    case "cut":    target = tdee*0.80; rate="−0,5…−0,7 кг в неделю"; label="Сушка"; break;
    case "bulk":   target = tdee*1.10; rate="+0,2…+0,35 кг в неделю"; label="Набор массы"; break;
    case "recomp": target = tdee*1.00; rate="вес держится ровно"; label="Рекомпозиция"; break;
    default:       target = tdee;      rate="вес держится ровно"; label="Поддержание";
  }
  const floor = input.sex==="f" ? 1200 : 1500;
  let floored = false;
  if(target < floor){ target = floor; floored = true; }
  return {bmr:r(b.value), formula:b.formula, tdee:r(tdee), target:r(target), rate, label, activity:act.ru, floored, deficit:r(tdee-target)};
}

function macros(input, kcal){
  const w = input.weight;
  const set = new Set(input.restrictions||[]);
  let pPerKg = 2.0;
  if(input.goal==="cut") pPerKg = 2.2;
  if(set.has("vegan")) pPerKg += 0.2;
  if(input.age>=45) pPerKg = Math.max(pPerKg, 2.0);
  let protein = r(w*pPerKg);

  let fat = r(Math.max(w*0.8, kcal*0.22/9));
  let carbKcal = kcal - protein*4 - fat*9;
  if(carbKcal < kcal*0.15){
    fat = r(Math.max(w*0.5, (kcal - protein*4 - kcal*0.15)/9));
    carbKcal = kcal - protein*4 - fat*9;
  }
  if(carbKcal < 0){
    protein = r((kcal - fat*9)*0.45/4);
    carbKcal = kcal - protein*4 - fat*9;
  }
  const carbs = r(Math.max(0, carbKcal/4));
  const fiber = r(kcal/1000*14);
  return {protein, fat, carbs, fiber, pPerKg:Math.round(pPerKg*10)/10};
}

function allowedFoods(restrictions){
  const set = new Set(restrictions||[]);
  const banTags = new Set();
  let banMeat=false, keepFish=false;
  const notes=[];
  set.forEach(kR=>{
    const rule = RESTRICTIONS[kR];
    if(!rule) return;
    (rule.excludeTags||[]).forEach(t=>banTags.add(t));
    if(rule.excludeCatMeat) banMeat=true;
    if(rule.keepFish) keepFish=true;
    if(rule.note) notes.push(rule.note);
  });
  const banIds = new Set(restrictions && restrictions.filter(x=>x.indexOf("no:")===0).map(x=>x.slice(3)) || []);
  const foods = FOODS.filter(f=>{
    if(banIds.has(f.id)) return false;
    if(banMeat && MEAT_IDS.indexOf(f.id)>=0) return false;
    if(banMeat && !keepFish && FISH_IDS.indexOf(f.id)>=0) return false;
    for(const t of f.tags){ if(banTags.has(t)) return false; }
    return true;
  });
  return {foods, notes};
}

function pickRot(list, i){ return list.length ? list[i % list.length] : null; }

const MEAL_SLOTS = {
  3: ["am","main","main"],
  4: ["am","main","snack","main"],
  5: ["am","snack","main","snack","main"],
  6: ["am","snack","main","snack","main","night"]
};
function inSlot(f, slot){
  if(!f.slot) return true;
  var list=f.slot.split(",");
  if(list.indexOf(slot)>=0) return true;
  if(slot==="night" && list.indexOf("snack")>=0) return true;
  return false;
}
function poolFor(foods, cat, slot){
  var strict = foods.filter(function(f){ return f.cat===cat && inSlot(f, slot); });
  if(cat==="protein"){
    var bestEff = 0;
    strict.forEach(function(f){ var e=f.p/Math.max(f.kcal,1); if(e>bestEff) bestEff=e; });
    if(strict.length < 3 || bestEff < 0.1){
      var extra = foods.filter(function(f){ return f.cat===cat && strict.indexOf(f)<0; });
      strict = strict.concat(extra);
    }
  }
  var pool = strict.length ? strict : foods.filter(function(f){ return f.cat===cat; });
  return pool.slice().sort(function(a,b){
    var pa=(a.spec?2:0)+(a.pure?1:0), pb=(b.spec?2:0)+(b.pure?1:0);
    return pa-pb;
  });
}

function buildMeals(input, m, foods, dayIndex){
  const nMeals = clamp(input.meals||4, 3, 6);
  const slots = MEAL_SLOTS[nMeals] || MEAL_SLOTS[4];
  const rot = dayIndex||0;

  if(!foods.filter(function(f){return f.cat==="protein" && f.p>=10;}).length)
    return {error:"Не осталось источников белка — ослабь ограничения."};

  // доли приёмов: завтрак и ужин весомее перекусов
  const weight = slots.map(function(sl){ return sl==="snack" ? 0.62 : sl==="night" ? 0.55 : 1; });
  const wsum = weight.reduce(function(a,b){return a+b;},0);

  const usedP = {}, usedC = {};
  const meals=[];

  let leftP=m.protein, leftC=m.carbs, leftF=m.fat, leftW=wsum;

  for(let i=0;i<nMeals;i++){
    const slot = slots[i];
    const share = weight[i]/leftW;
    const pTarget = Math.max(0, leftP*share);
    const cTarget = Math.max(0, leftC*share);
    const fTarget = Math.max(0, leftF*share);

    let pPool = poolFor(foods,"protein",slot).filter(function(f){ return f.p>=8; });
    if(!pPool.length) pPool = poolFor(foods,"protein",slot);
    if(input.goal==="cut" && pPool.length>1){
      const eff=function(f){ return f.p/Math.max(f.kcal,1); };
      let bestEff=0; pPool.forEach(function(f){ if(eff(f)>bestEff) bestEff=eff(f); });
      const effOK=pPool.filter(function(f){ return eff(f) >= bestEff*0.7; });
      if(effOK.length) pPool = effOK;
    }
    const poolRich = pPool.length >= 4;
    if(fTarget>0 && poolRich){
      const fatOf=function(f){
        const g = clamp(pTarget/(f.p/100), 20, maxPortion(f));
        return g*f.f/100;
      };
      // не берём тех, кто перебирает бюджет жира
      const notFat = pPool.filter(function(f){ return fatOf(f) <= fTarget*1.05; });
      if(notFat.length) pPool = notFat;
      // среди оставшихся предпочитаем тех, кто сам даёт заметную часть жира
      const carries = pPool.filter(function(f){ return fatOf(f) >= fTarget*0.3; });
      if(carries.length >= 2 || (carries.length===1 && pPool.length<=2)) pPool = carries;
    }
    const mealKcal = pTarget*4 + cTarget*4 + fTarget*9;
    if(mealKcal>0 && pPool.length>1){
      const kfit = pPool.filter(function(f){
        const g = clamp(pTarget/(f.p/100), 20, maxPortion(f));
        return (g*f.kcal/100) <= mealKcal*0.72;
      });
      if(kfit.length) pPool = kfit;
    }
    if(poolRich){
      const fits = pPool.filter(function(f){
        const minG = MIN_PORTION[f.id] || 20;
        return (minG*f.p/100) <= pTarget*1.12;
      });
      if(fits.length) pPool = fits;
    }
    let cPool = poolFor(foods,"carb",slot);
    let fPool = poolFor(foods,"fat",slot);
    const vPool = poolFor(foods,"veg",slot);

    const fresh = function(pool, used){
      const un = pool.filter(function(f){ return !used[f.id]; });
      return un.length ? un : pool;
    };
    const pf = pickRot(fresh(pPool, usedP), i + rot*2);
    const pfGuess = pf ? clamp(pTarget/(pf.p/100), 20, maxPortion(pf)) : 0;
    const carbFromP = pf ? pfGuess*pf.c/100 : 0;
    const needCarb = cTarget - carbFromP;
    const cf = needCarb>10 ? pickRot(fresh(cPool, usedC), i + rot) : null;
    const fWhole = fPool.filter(function(f){ return !f.pure; });
    const ff = pickRot(fWhole.length ? fWhole : fPool, i + rot);
    const vf = (slot==="main") ? pickRot(vPool, i + rot) : null;
    if(pf) usedP[pf.id]=1;
    if(cf) usedC[cf.id]=1;

    const gV = vf ? 150 : 0;
    let gP = clamp(pTarget/(pf.p/100), 20, maxPortion(pf));
    let gC = cf ? clamp(cTarget/Math.max(cf.c/100,0.01), 20, maxPortion(cf)) : 0;
    let gF = ff ? clamp(fTarget/Math.max(ff.f/100,0.01)*0.45, 0, maxPortion(ff)) : 0;

    for(let it=0; it<14; it++){
      const curP = gP*pf.p/100 + (cf?gC*cf.p/100:0) + (ff?gF*ff.p/100:0) + (gV?gV*vf.p/100:0);
      const curC = gP*pf.c/100 + (cf?gC*cf.c/100:0) + (ff?gF*ff.c/100:0) + (gV?gV*vf.c/100:0);
      const curF = gP*pf.f/100 + (cf?gC*cf.f/100:0) + (ff?gF*ff.f/100:0) + (gV?gV*vf.f/100:0);
      if(pf.p>0) gP = clamp(gP + (pTarget-curP)/(pf.p/100)*0.7, 20, maxPortion(pf));
      if(cf && cf.c>0) gC = clamp(gC + (cTarget-curC)/(cf.c/100)*0.7, 20, maxPortion(cf));
      if(ff && ff.f>0) gF = clamp(gF + (fTarget-curF)/(ff.f/100)*0.7, 0, maxPortion(ff));
    }

    const items=[];
    items.push(mkItem(pf, roundPortion(gP, pf, gP < (MIN_PORTION[pf.id]||20)*0.8)));
    if(cf) items.push(mkItem(cf, roundPortion(gC, cf)));
    if(ff && gF>=8 && leftF>4){
      var gFat = Math.round(gF/5)*5;
      if(ff.pure) gFat = Math.min(gFat, slot==="main" ? 12 : 8);
      if(gFat>=5) items.push(mkItem(ff, gFat));
    }
    if(vf) items.push(mkItem(vf, gV));

    const tot = items.reduce(function(a,x){return {kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fib:a.fib+x.fib};},{kcal:0,p:0,f:0,c:0,fib:0});
    leftP -= tot.p; leftC -= tot.c; leftF -= tot.f; leftW -= weight[i];
    meals.push({name: mealName(i,nMeals,slot), items:items,
      total:{kcal:r(tot.kcal),p:r(tot.p),f:r(tot.f),c:r(tot.c),fib:r(tot.fib)}});
  }
  return {meals:meals};
}

const MIN_PORTION = {
  chicken_breast:100, turkey_fillet:100, beef_mince_5:100, pork_lean:100,
  cod:120, mackerel:100, salmon:100, tuna_can:80, shrimp:100,
  cottage_cheese:100, cottage_cheese_0:100, greek_yogurt:100, kefir:200, milk:200,
  hard_cheese:30, whey:25, soy_protein:25, pea_protein:25,
  tofu:100, lentils:60, chickpeas:60, beans_red:60,
  oats:40, rice_white:50, buckwheat:50, pasta:50, potato:150, sweet_potato:150,
  bread_whole:40, bread_gf:40, banana:100, apple:120, berries:100,
  olive_oil:5, butter:5, peanut_butter:15, almonds:15, walnuts:15,
  avocado:40, seeds_sunflower:15, honey:10
};
const MAX_OVERRIDE = {
  lentils:180, chickpeas:180, beans_red:180, tofu:400,
  eggs:300, egg_whites:450, hard_cheese:80,
  whey:60, soy_protein:60, pea_protein:60,
  kefir:600, milk:600, greek_yogurt:450,
  cottage_cheese:350, cottage_cheese_0:350
};
function maxPortion(f){
  if(MAX_OVERRIDE[f.id]) return MAX_OVERRIDE[f.id];
  if(f.cat==="fat")     return f.kcal>=700 ? 45 : (f.kcal>=500 ? 70 : 220);
  if(f.cat==="protein") return f.kcal>=350 ? 60 : (f.kcal>=150 ? 350 : 500);
  if(f.cat==="carb")    return f.kcal>=300 ? 260 : (f.kcal>=150 ? 420 : 700);

  var v = g>=100 ? Math.round(g/10)*10 : Math.round(g/5)*5;

}

function mkItem(f, grams){
  return {id:f.id, ru:f.ru, grams, kcal:f.kcal*grams/100, p:f.p*grams/100, f:f.f*grams/100, c:f.c*grams/100, fib:f.fib*grams/100};

function mealName(i,n,slot){
  if(n===3) return ["Завтрак","Обед","Ужин"][i];
  if(n===4) return ["Завтрак","Обед","Перекус","Ужин"][i];
  if(n===5) return ["Завтрак","Перекус","Обед","Перекус","Ужин"][i];

function generateNutrition(input){
  input = Object.assign({sex:"m",age:30,height:180,weight:80,activity:"light",goal:"recomp",meals:4,restrictions:[]}, input||{});
  const e = energy(input);

  const {foods, notes} = allowedFoods(input.restrictions);
  const goalNotes = [];
  if(input.goal==="cut"){

    goalNotes.push("Раз в 7–10 дней делай рефид: плюс 25–30% калорий за счёт углеводов.");
    goalNotes.push("Если вес не падает 2–3 недели, убери ещё 150–200 ккал, не больше.");
    goalNotes.push("Овощи и объёмная еда дают сытость почти без калорий.");
  }
  if(input.goal==="bulk"){
    goalNotes.push("Если вес стоит 2–3 недели, добавь 150–200 ккал углеводами. Если прибавляешь больше 0,4 кг в неделю, убавь: лишнее уходит в жир.");

    if(actual.p < m.protein*0.9){

}

/* ---------- the barbell: plates are computed from the load, not drawn by hand ---------- */

var BAR_KG=20, PLATESET=[20,15,10,5,2.5,1.25];
// Diameter (share of height), thickness (exaggerated x2), colour step. Small plates differ in both.
var PLATE={20:{d:1,t:21,c:1}, 15:{d:1,t:17,c:2}, 10:{d:1,t:13,c:2}, 5:{d:.6,t:11,c:3}, 2.5:{d:.46,t:9,c:4}, 1.25:{d:.3,t:5,c:4}};
function isBarbell(x){ return eqFor(x)==="bb"; }
function perSide(load){
  var r=(load-BAR_KG)/2, out=[];
  if(!(r>0)) return out;
  PLATESET.forEach(function(p){ while(r>=p-1e-9){ out.push(p); r-=p; } });
  return out;
}
function barLabel(load){
  var ps=perSide(load);
  return "На грифе "+kg(load)+(ps.length ? ": по "+ps.map(fmt).join(", ")+" с каждой стороны" : "");
}
var barUid=0;
function barSVG(load, o){
  o=o||{};
  var W=o.w||402, H=o.h||76, L=o.len||W, off=(W-L)/2, k=Math.max(.85, L/470);
  var rest=o.rest, cy=H/2, sleeve=Math.round(L*0.2), cw=6*k, out=[], uid=++barUid;
  function R(x, y, w, hh, cls, rx, extra){
    return '<rect class="'+cls+'" x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+Math.max(0,w).toFixed(2)+'" height="'+hh.toFixed(2)+'" rx="'+(rx||0).toFixed(2)+'"'+(extra||"")+'/>';
  }
  if(rest!=null) out.push('<defs><pattern id="knurl'+uid+'" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<rect class="b-knurl" width="3.4" height="3.4"/><rect class="b-knurl-line" width="1.1" height="3.4"/><rect class="b-knurl-line" width="3.4" height="1.1"/></pattern></defs>');
  var sh=H*0.16;
  out.push(R(off, cy-sh/2, sleeve, sh, "b-chrome", sh/2), R(off+L-sleeve, cy-sh/2, sleeve, sh, "b-chrome", sh/2));
  var x0=off+sleeve+cw, x1=off+L-sleeve-cw;
  if(rest==null) out.push(R(x0, cy-2.25, x1-x0, 4.5, "b-steel", 0));
  else {
    var t=11, frac=Math.max(0, Math.min(1, rest));
    out.push(R(x0, cy-t/2, x1-x0, t, "b-spent", 2.5));
    out.push(R(x0, cy-t/2, (x1-x0)*frac, t, "b-knurl-fill", 2.5, ' fill="url(#knurl'+uid+')" data-x0="'+x0.toFixed(2)+'" data-span="'+(x1-x0).toFixed(2)+'"'));
  }
  var ch=H*0.34;
  out.push(R(off+sleeve, cy-ch/2, cw, ch, "b-collar", 1.5), R(off+L-sleeve-cw, cy-ch/2, cw, ch, "b-collar", 1.5));
  var plates=perSide(load), n=plates.length, xl=off+sleeve-1, xr=off+L-sleeve+1;
  plates.forEach(function(p, i){
    var P=PLATE[p], ph=H*P.d, tt=P.t*k, rx=Math.min(3, tt/4);
    [[xl-tt, -1], [xr, 1]].forEach(function(s){
      out.push('<g class="plate" style="--i:'+i+';--o:'+(n-1-i)+';--s:'+s[1]+'">'+
        R(s[0], cy-ph/2, tt, ph, "b-plate b-p"+P.c, rx)+
        R(s[0]+tt*0.18, cy-ph/2+3, Math.max(1.2, tt*0.12), ph-6, "b-glint", 0.6)+'</g>');
    });
    xl-=tt+1; xr+=tt+1;
  });
  var kh=H*0.26, kw=8*k;
  if(n) out.push('<g class="plate lock" style="--i:'+n+';--o:0;--s:-1">'+R(xl-kw, cy-kh/2, kw, kh, "b-collar", 2)+'</g>',
                 '<g class="plate lock" style="--i:'+n+';--o:0;--s:1">'+R(xr, cy-kh/2, kw, kh, "b-collar", 2)+'</g>');
  return '<svg class="bar-art'+(o.cls?" "+o.cls:"")+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label!=null ? o.label : barLabel(load))+'">'+out.join("")+'</svg>';
}

// Every load gets a picture: the bar with its plates, a dumbbell, a pinned weight stack, a plate on a belt.
// The equipment this lifter will use: the first one in the exercise's list that the gym has.
function eqFor(x){
  var list=x && x.eq || [], have=S.profile && S.profile.equipment || [];
  for(var i=0;i<list.length;i++) if(have.indexOf(list[i])>=0) return list[i];
  return list[0] || "";
}
function loadKind(x){ var e=eqFor(x); return e==="bb" ? "bar" : e==="db" ? "db" : (e==="cable" || e==="machine") ? "stack" : e==="bw" ? "bw" : ""; }
function loadArt(x, w, o){
  o=o||{};
  var kind=loadKind(x), ghost=w==null, cls=(o.cls||"")+(ghost?" is-ghost":"");
  if(kind==="bar") return barSVG(ghost || w<BAR_KG ? BAR_KG : w, {w:402, len:470, h:o.h||76, cls:"bleed "+cls, label:ghost ? "Пустой гриф" : null});
  if(kind==="db") return dumbbellSVG(ghost ? 0 : w, cls);
  if(kind==="stack") return ghost || !(w>0) ? "" : stackSVG(w, cls);
  if(kind==="bw" && w>0) return beltSVG(w, cls);
