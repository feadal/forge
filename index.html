<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>FORGE — конструктор тренировок</title>
</head>
<body>
<style>
:root{
  --bg:#0a0c0f; --surface:#12151a; --elev:#1a1e25; --raise:#222732;
  --line:#232832; --line-soft:#1b202a;
  --text:#e9edf3; --strong:#ffffff; --muted:#8d97a8; --faint:#5d6779;
  --accent:#2dd4bf; --accent-dim:#1a9e8f; --accent-glow:rgba(45,212,191,.15); --on-accent:#04211d;
  --hot:#f5a524; --hot-tint:rgba(245,165,36,.12);
  --good:#4ade80; --good-tint:rgba(74,222,128,.13);
  --bad:#f87171;
  --r-sm:10px; --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.85);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --elev:#eef1f4; --raise:#e5e9ee;
    --line:#e0e4e9; --line-soft:#edeff2;
    --text:#181b21; --strong:#080a0d; --muted:#5c6675; --faint:#8b95a5;
    --accent:#0d9488; --accent-dim:#0f766e; --accent-glow:rgba(13,148,136,.1); --on-accent:#ffffff;
    --hot:#b45309; --hot-tint:rgba(180,83,9,.09);
    --good:#15803d; --good-tint:rgba(21,128,61,.1);
    --bad:#b91c1c;
    --shadow:0 1px 2px rgba(16,20,28,.05), 0 12px 28px -20px rgba(16,20,28,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c0f; --surface:#12151a; --elev:#1a1e25; --raise:#222732;
  --line:#232832; --line-soft:#1b202a;
  --text:#e9edf3; --strong:#ffffff; --muted:#8d97a8; --faint:#5d6779;
  --accent:#2dd4bf; --accent-dim:#1a9e8f; --accent-glow:rgba(45,212,191,.15); --on-accent:#04211d;
  --hot:#f5a524; --hot-tint:rgba(245,165,36,.12);
  --good:#4ade80; --good-tint:rgba(74,222,128,.13); --bad:#f87171;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --elev:#eef1f4; --raise:#e5e9ee;
  --line:#e0e4e9; --line-soft:#edeff2;
  --text:#181b21; --strong:#080a0d; --muted:#5c6675; --faint:#8b95a5;
  --accent:#0d9488; --accent-dim:#0f766e; --accent-glow:rgba(13,148,136,.1); --on-accent:#ffffff;
  --hot:#b45309; --hot-tint:rgba(180,83,9,.09);
  --good:#15803d; --good-tint:rgba(21,128,61,.1); --bad:#b91c1c;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:520px;margin:0 auto;padding:14px 18px 96px}
h1,h2,h3,h4{margin:0;color:var(--strong);letter-spacing:-.022em;line-height:1.22}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:ui-monospace,"SF Mono",Menlo,monospace}

.intro{padding:40px 2px 8px;text-align:center}
.intro h1{font-size:2.8rem;font-weight:800;letter-spacing:-.045em;
  background:linear-gradient(180deg,var(--strong),var(--muted));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.intro h2{font-size:1.45rem;font-weight:750;margin-bottom:8px}
.lead{color:var(--muted);font-size:.96rem;margin:14px 0 30px;text-wrap:balance;line-height:1.55}
.feats{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;text-align:left}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px 15px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.feat::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.feat b{display:block;color:var(--strong);font-size:.96rem;font-weight:650;margin-bottom:3px}
.feat span{color:var(--muted);font-size:.85rem;line-height:1.45;display:block}
.fine{color:var(--faint);font-size:.78rem;margin-top:18px;line-height:1.5}

.accent-btn{width:100%;background:var(--accent);color:var(--on-accent);
  font-size:.97rem;font-weight:700;padding:16px;border-radius:var(--radius);margin-top:14px;
  letter-spacing:-.012em;transition:transform .12s ease,filter .12s ease}
.accent-btn.big{padding:18px;font-size:1.02rem}
.accent-btn:active{transform:scale(.985);filter:brightness(.93)}
.ghost-btn{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:.88rem;font-weight:600;padding:14px;border-radius:var(--radius);margin-top:10px;
  transition:border-color .15s,color .15s}
.ghost-btn:active{border-color:var(--accent);color:var(--text)}
.ghost-btn.danger:active{border-color:var(--bad);color:var(--bad)}

.wz-head{display:flex;align-items:center;gap:14px;margin:2px 0 28px}
.wz-prog{flex:1;height:5px;background:var(--elev);border-radius:99px;overflow:hidden}
.wz-prog span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));
  transition:width .32s cubic-bezier(.4,0,.2,1)}
.wz-count{font-size:.76rem;color:var(--faint);font-variant-numeric:tabular-nums}
.wz-q{font-size:1.6rem;font-weight:750;margin-bottom:6px;text-wrap:balance;letter-spacing:-.032em}
.wz-sub{color:var(--muted);font-size:.87rem;margin:0;line-height:1.45}
.wz-body{margin-top:22px;display:flex;flex-direction:column;gap:10px}

.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 17px;color:var(--text);transition:border-color .15s,background .15s,transform .12s}
.opt b{display:block;font-size:1.02rem;font-weight:650;color:var(--strong);letter-spacing:-.018em}
.opt i{display:block;font-style:normal;font-size:.83rem;color:var(--muted);margin-top:3px;line-height:1.4}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--accent);background:var(--accent-glow)}

.numwrap{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px 18px;transition:border-color .15s}
.numwrap:focus-within{border-color:var(--accent)}
.numin{flex:1;background:transparent;border:none;outline:none;color:var(--strong);
  font-size:32px;font-weight:700;padding:12px 0;width:100%;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.numunit{color:var(--muted);font-size:.92rem;font-weight:500}

.multi{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:11px 16px;color:var(--text);font-size:.87rem;font-weight:550;transition:all .15s}
.chip.on{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}

.topbar{margin-bottom:13px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand b{font-size:1.5rem;font-weight:800;letter-spacing:-.045em;color:var(--accent)}
.brand span{font-size:.75rem;color:var(--muted);text-align:right;line-height:1.35;max-width:62%}
.weekbar{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:5px}
.stp{width:38px;height:38px;border-radius:var(--r-sm);background:var(--elev);color:var(--text);
  font-size:.85rem;transition:background .15s}
.stp:active{background:var(--raise)}
.wkmid{flex:1;text-align:center}
.wkmid b{display:block;font-size:.95rem;font-weight:650;color:var(--strong)}
.wkmid i{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:600}

.tabs{display:flex;gap:4px;margin:0 0 13px;background:var(--elev);padding:4px;border-radius:var(--radius)}
.tab{flex:1;padding:11px 4px;color:var(--muted);font-size:.86rem;font-weight:600;
  border-radius:var(--r-sm);transition:all .18s;letter-spacing:-.01em}
.tab.on{background:var(--surface);color:var(--strong);box-shadow:0 1px 3px rgba(0,0,0,.25)}

.daynav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:11px;
  scrollbar-width:none;-ms-overflow-style:none}
.daynav::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;padding:10px 15px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:.83rem;font-weight:600;white-space:nowrap;
  transition:all .15s}
.dbtn.on{border-color:transparent;color:var(--on-accent);background:var(--accent)}

.progwrap{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.progbar{flex:1;height:6px;background:var(--elev);border-radius:99px;overflow:hidden}
.progbar span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .3s ease}
.progtxt{font-size:.79rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;font-weight:650;line-height:1.3;text-wrap:balance;letter-spacing:-.02em}
.card h3 small{font-weight:500;color:var(--muted);font-size:.77rem;margin-left:6px;letter-spacing:0}
.cmeta{font-size:.79rem;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmeta b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.cue{font-size:.8rem;color:var(--muted);margin:10px 0 11px;padding:8px 11px;
  background:var(--elev);border-radius:var(--r-sm);line-height:1.45;border-left:2px solid var(--line)}

.sets{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:9px;padding:4px 5px;border-radius:var(--r-sm);
  transition:background .2s}
.srow.done{background:var(--good-tint)}
.snum{width:17px;text-align:center;font-size:.73rem;font-weight:700;color:var(--faint);
  font-family:ui-monospace,monospace}
.fld{position:relative;flex:1;display:flex;align-items:center}
.fld input{width:100%;height:48px;background:var(--elev);border:1px solid transparent;
  border-radius:var(--r-sm);color:var(--text);font-size:16px;font-weight:650;text-align:center;
  padding:0 32px 0 8px;outline:none;font-variant-numeric:tabular-nums;transition:all .15s}
.fld input:focus{border-color:var(--accent);background:var(--surface)}
.unit{position:absolute;right:10px;font-size:.72rem;color:var(--muted);pointer-events:none;font-weight:500}
.fld input::placeholder{color:var(--faint);font-weight:500;opacity:1}
.ck{width:48px;height:48px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:transparent;color:transparent;font-size:1.1rem;font-weight:800;transition:all .18s}
.srow.done .ck{background:var(--good);border-color:var(--good);color:#06210f}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 5px;text-align:center;box-shadow:var(--shadow)}
.tk{display:block;font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  margin-bottom:6px;font-weight:600}
.tv{font-size:1.36rem;font-weight:750;color:var(--strong);font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.03em}
.tile.acc{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-glow)}
.tile.acc .tv{color:var(--accent)}

.hint{font-size:.81rem;color:var(--muted);margin:4px 2px 16px;line-height:1.5}
.warn{background:var(--hot-tint);border:1px solid color-mix(in srgb,var(--hot) 28%,transparent);
  border-radius:var(--radius);padding:13px 15px;font-size:.83rem;color:var(--text);
  margin-bottom:14px;display:flex;flex-direction:column;gap:7px;line-height:1.5}
.row2{display:flex;gap:9px}
.row2 .accent-btn,.row2 .ghost-btn{margin-top:6px;padding:12px;font-size:.85rem}

.fitems{display:flex;flex-direction:column;margin-top:10px}
.fitem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:.88rem}
.fitem:last-child{border-bottom:none}
.fitem b{font-family:ui-monospace,monospace;color:var(--accent);font-weight:700;white-space:nowrap;
  font-variant-numeric:tabular-nums}

.prows{display:flex;flex-direction:column;margin-top:10px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-soft);font-size:.87rem}
.prow:last-child{border-bottom:none}
.prow span{color:var(--muted)}
.prow b{color:var(--strong);font-weight:650;text-align:right}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;margin-top:12px;box-shadow:var(--shadow)}
.bh{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  margin-bottom:10px;font-weight:700}
.hrow{font-size:.84rem;color:var(--text);padding:10px 0;border-bottom:1px solid var(--line-soft)}
.hrow:last-child{border-bottom:none}

#rest{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  align-items:center;justify-content:center;gap:14px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -8px 28px -14px rgba(0,0,0,.8)}
#rest.show{display:flex}
#rest .rl{font-size:.8rem;color:var(--muted);font-weight:600}
#rest .rt{font-size:1.7rem;font-weight:750;color:var(--accent);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest .rx{padding:9px 15px;border-radius:99px;background:var(--elev);color:var(--muted);
  font-size:.82rem;font-weight:600}
#rest .rx:active{background:var(--raise)}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);
  background:var(--strong);color:var(--bg);font-size:.86rem;font-weight:650;padding:12px 20px;
  border-radius:99px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:50;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.6);max-width:82%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app"></div>
<div id="toast"></div>
<div id="rest"></div>
<script>
var FORGE=(function(){
"use strict";

const MUSCLES = ["chest","lats","upback","sdelt","rdelt","biceps","triceps","quads","hams","glutes","calves","traps","core"];

const MUSCLE_RU = {
  chest:"Грудь", lats:"Широчайшие", upback:"Верх спины", sdelt:"Средние дельты",
  rdelt:"Задние дельты", biceps:"Бицепс", triceps:"Трицепс", quads:"Квадрицепс",
  hams:"Бицепс бедра", glutes:"Ягодицы", calves:"Икры", traps:"Трапеции", core:"Кор"
};

const BASE_VOL = {
  chest:14, lats:14, upback:10, sdelt:14, rdelt:8, biceps:10, triceps:10,
  quads:14, hams:10, glutes:10, calves:10, traps:6, core:8
};

const GROUP = {
  push: ["chest","sdelt","triceps"],
  pull: ["lats","upback","rdelt","biceps","traps"],
  legs: ["quads","hams","glutes","calves"],
  core: ["core"]
};
const UPPER = [].concat(GROUP.push, GROUP.pull);
const ALL = [].concat(UPPER, GROUP.legs, GROUP.core);

const EX = [
  {id:"inc_db_press", n:"Жим гантелей на наклонной 30°", m:"chest", sec:["fdelt","triceps"], eq:["db"], t:"comp", pat:"hpress", stretch:true, cue:"Локти ~45°, растяжение внизу"},
  {id:"flat_bb_bench", n:"Жим штанги лёжа", m:"chest", sec:["fdelt","triceps"], eq:["bb"], t:"comp", pat:"hpress", cue:"Лопатки сведены, ноги в пол"},
  {id:"flat_db_press", n:"Жим гантелей лёжа", m:"chest", sec:["fdelt","triceps"], eq:["db"], t:"comp", pat:"hpress", stretch:true, cue:"Глубокое растяжение"},
  {id:"dip", n:"Отжимания на брусьях", m:"chest", sec:["triceps"], eq:["bw"], t:"comp", pat:"dip", stretch:true, cue:"Наклон корпуса вперёд на грудь"},
  {id:"cable_fly", n:"Сведения в кроссовере снизу-вверх", m:"chest", eq:["cable"], t:"iso", pat:"fly", stretch:true, cue:"К верху груди, сжатие 1 сек"},
  {id:"pecdeck", n:"Бабочка (пек-дек)", m:"chest", eq:["machine"], t:"iso", pat:"fly", cue:"Полное сведение"},

  {id:"pullup", n:"Подтягивания", m:"lats", sec:["biceps","upback"], eq:["bw"], t:"comp", pat:"vpull", stretch:true, cue:"Полная амплитуда, свод лопаток"},
  {id:"lat_pulldown", n:"Тяга верхнего блока", m:"lats", sec:["biceps"], eq:["cable"], t:"comp", pat:"vpull", stretch:true, cue:"Тяни локтями вниз"},
  {id:"pullover", n:"Пуловер на блоке", m:"lats", eq:["cable"], t:"iso", pat:"pullover", stretch:true, cue:"Растяжение широчайших вверху"},

  {id:"barbell_row", n:"Тяга штанги в наклоне", m:"upback", sec:["lats","biceps"], eq:["bb"], t:"comp", pat:"hpull", cue:"Спина ровная, тяни к поясу"},
  {id:"chest_row", n:"Тяга гантели в упоре (грудь в лавку)", m:"upback", sec:["lats"], eq:["db"], t:"comp", pat:"hpull", cue:"Корпус зафиксирован"},
  {id:"seated_row", n:"Горизонтальная тяга блока", m:"upback", sec:["lats","biceps"], eq:["cable"], t:"comp", pat:"hpull", cue:"Сводим лопатки"},

  {id:"facepull", n:"Тяга к лицу (face pull)", m:"rdelt", sec:["upback","traps"], eq:["cable"], t:"iso", pat:"rear", cue:"Разворот кистей наружу"},
  {id:"reverse_pecdeck", n:"Обратная бабочка", m:"rdelt", eq:["machine"], t:"iso", pat:"rear", cue:"Ведём локтями"},
  {id:"cable_rear_fly", n:"Разведение на задние дельты в кроссовере", m:"rdelt", eq:["cable"], t:"iso", pat:"rear", cue:"Без раскачки"},

  {id:"db_lat_raise", n:"Махи гантелями в стороны", m:"sdelt", eq:["db"], t:"iso", pat:"lateral", cue:"Мизинец чуть выше, контроль вниз"},
  {id:"cable_lat_raise", n:"Махи в стороны на блоке", m:"sdelt", eq:["cable"], t:"iso", pat:"lateral", stretch:true, cue:"Постоянное натяжение"},

  {id:"ohp", n:"Жим штанги стоя", m:"sdelt", sec:["triceps"], eq:["bb"], t:"comp", pat:"vpress", cue:"Кор в напряжении, без прогиба"},
  {id:"db_shoulder_press", n:"Жим гантелей сидя", m:"sdelt", sec:["triceps"], eq:["db"], t:"comp", pat:"vpress", cue:"Не заваливай локти назад"},

  {id:"incline_db_curl", n:"Сгибания на бицепс на наклонной", m:"biceps", eq:["db"], t:"iso", pat:"curl", stretch:true, cue:"Растяжка в нижней точке"},
  {id:"preacher_curl", n:"Сгибания на скамье Скотта", m:"biceps", eq:["machine","db"], t:"iso", pat:"curl_short", cue:"Не срывай с нижней точки"},
  {id:"cable_curl", n:"Сгибания на блоке", m:"biceps", eq:["cable"], t:"iso", pat:"curl_short", cue:"Постоянное натяжение"},

const SPLIT_TPL = {
  bro_ant: {ru:"Сплит: грудь+бицепс / спина+трицепс", byDays:true,                        minDays:3, maxDays:6},
  bro_syn: {ru:"Сплит: грудь+трицепс / спина+бицепс", byDays:true,                        minDays:3, maxDays:6},
  full:  {ru:"Фулбади",         parts:[["full","Всё тело"]],                             minDays:2, maxDays:4},
  ul:    {ru:"Верх / Низ",       parts:[["upper","Верх"],["lower","Низ"]],                minDays:2, maxDays:6},
  ppl:   {ru:"Пуш / Пул / Ноги", parts:[["push","Жим"],["pull","Тяга"],["legs","Ноги"]],  minDays:3, maxDays:6},
  upper: {ru:"Только верх",      parts:[["upper","Верх"]],                                minDays:2, maxDays:6}
};

function splitOptionsFor(days, legs){
  const out = ["auto"];
  Object.keys(SPLIT_TPL).forEach(k=>{
    const t = SPLIT_TPL[k];
    if(days < t.minDays || days > t.maxDays) return;
    if(t.byDays){
      const tables = BRO_TABLES[k];
      if(!tables) return;
      const table = legs ? tables.legs : tables.upper;
      if(!table || !table[days]) return;
      out.push(k);
      return;
    }
    if(!legs && k !== "upper") return;
    if(legs && k === "upper") return;
    out.push(k);
  });
  return out;
}

function daysOptionsFor(pref, legs){
  const out = [];
  for(let d=2; d<=6; d++){
    if(!pref || pref==="auto"){ out.push(d); continue; }
    if(splitOptionsFor(d, legs).indexOf(pref) >= 0) out.push(d);
  }
  return out.length ? out : [2,3,4,5,6];
}

function buildFromTemplate(pref, days, legs){
  const t = SPLIT_TPL[pref];
  if(!t) return null;
  if(t.byDays){
    const tables = BRO_TABLES[pref];
    if(!tables) return null;
    const table = legs ? tables.legs : tables.upper;
    const rows = table && table[days];
    if(!rows) return null;
    return {name: t.ru + " · " + days + " дн/нед",
            days: rows.map(r=>({name:r[0], muscles:r[1].slice()}))};
  }
  const tpl = { upper: UPPER.concat("core"), lower: GROUP.legs, full: ALL, push: GROUP.push, pull: GROUP.pull.concat("core"), legs: GROUP.legs };
  const seq = [];
  const seen = {};
  for(let i=0;i<days;i++){
    const part = t.parts[i % t.parts.length];
    const key = part[0];
    seen[key] = (seen[key]||0) + 1;
    const many = days > t.parts.length;
    const label = part[1] + (many ? " " + String.fromCharCode(64+seen[key]) : "");
    seq.push({name: label, muscles: (tpl[key]||ALL).slice()});
  }
  const label = (days % t.parts.length === 0)
    ? t.ru + " ×" + (days / t.parts.length)
    : t.ru + " · " + days + " дн/нед";
  return {name: label, days: seq};
}

function chooseSplit(days, legs, goal, pref){
  const U="upper", L="lower", F="full", P="push", Pu="pull", Lg="legs";
  const tpl = { upper: UPPER, lower: GROUP.legs, full: ALL, push: GROUP.push, pull: GROUP.pull.concat("core"), legs: GROUP.legs };
  if(pref && pref!=="auto" && splitOptionsFor(days, legs).indexOf(pref)>=0){
    const built = buildFromTemplate(pref, days, legs);
    if(built) return built;
  }
  let seq;
  if(!legs){
    const u=(k)=>({name:"Верх "+k, muscles:UPPER.concat("core")});
    if(days<=2) seq=[u("A"),u("B")];
    else if(days===3) seq=[u("A"),u("B"),u("C")];
    else if(days===4) seq=[u("A"),u("B"),u("A2"),u("B2")];
    else if(days===5) seq=[u("A"),u("B"),u("A2"),u("B2"),u("C")];
    else seq=[u("A"),u("B"),u("A2"),u("B2"),u("A3"),u("B3")];
    return {name:"Только верх ×"+days, days:seq};
  }
  const mk=(key,label)=>({name:label, muscles:tpl[key].slice()});
  if(days<=2){ seq=[mk("full","Всё тело A"),mk("full","Всё тело B")]; return splitName("Фулбади ×2",seq); }
  if(days===3){ seq=[mk("full","Всё тело A"),mk("full","Всё тело B"),mk("full","Всё тело C")]; return splitName("Фулбади ×3",seq); }
  if(days===4){ seq=[mk("upper","Верх A"),mk("lower","Низ A"),mk("upper","Верх B"),mk("lower","Низ B")]; return splitName("Верх/Низ ×2",seq); }
  if(days===5){ seq=[mk("push","Жим (пуш)"),mk("pull","Тяга (пул)"),mk("legs","Ноги"),mk("upper","Верх"),mk("lower","Низ")]; return splitName("Пуш/Пул/Ноги + Верх/Низ",seq); }
  seq=[mk("push","Жим A"),mk("pull","Тяга A"),mk("legs","Ноги A"),mk("push","Жим B"),mk("pull","Тяга B"),mk("legs","Ноги B")];
  return splitName("Пуш/Пул/Ноги ×2",seq);
}
function splitName(name,days){ return {name, days}; }

function weeklyVolume(input){
  const expMul = {beg:0.7, int:1.0, adv:1.15}[input.level] || 1.0;
  const vol = {};
  MUSCLES.forEach(m=>{
    let base = BASE_VOL[m]*expMul;
    if(input.goal==="str") base *= 0.75;
    if(input.goal==="cut") base *= 0.9;
    if(input.emphasis && input.emphasis.indexOf(m)>=0) base *= 1.4;
    if(input.exclude && input.exclude.indexOf(m)>=0) base = 0;
    if(!input.legs && GROUP.legs.indexOf(m)>=0) base = 0;
    vol[m] = base>0 ? clamp(round(base),4,26) : 0;
  });
  return vol;
}

function sessionCap(minutes){
  if(minutes<=45) return 14;
  if(minutes<=60) return 18;
  if(minutes<=75) return 22;
  return 26;
}

function maxExercises(minutes, level){
  let n = minutes<=45?4 : minutes<=60?5 : minutes<=75?6 : 7;
  if(level==="beg") n = Math.min(n, 5);
  return n;
}

function repScheme(goal, ex, isMain){
  if(goal==="str"){
    if(ex.t==="comp" && isMain) return {reps:"3–5", rir:"2"};
    if(ex.t==="comp") return {reps:"5–8", rir:"2"};
    return {reps:"6–10", rir:"1–2"};
  }
  if(goal==="hybrid"){
    if(ex.t==="comp" && isMain) return {reps:"4–6", rir:"2"};
    if(ex.t==="comp") return {reps:"6–10", rir:"1–2"};
    return {reps:"10–15", rir:"0–1"};
  }
  if(goal==="cut"){
    if(ex.t==="comp" && isMain) return {reps:"5–8", rir:"2"};
    if(ex.t==="comp") return {reps:"6–10", rir:"2"};
    return {reps:"12–20", rir:"0–1"};
  }
  if(ex.t==="comp") return {reps:"6–10", rir:"1–2"};
  return {reps:"10–15", rir:"0–1"};
}

function pickExercises(muscle, nsets, eqSet, usedPat, goal, rot, banned){
  let pool = EX.filter(e=> e.m===muscle && e.eq.some(x=>eqSet.has(x)) && !(banned && banned.has(e.id)));
  if(!pool.length) pool = EX.filter(e=> e.m===muscle && e.eq.some(x=>eqSet.has(x)));
  const score = (e)=> (e.t==="comp"?2:0) + (e.stretch?1:0);
  pool.sort((a,b)=> score(b)-score(a));
  if(rot && pool.length>1){
    const k = rot % pool.length;
    pool = pool.slice(k).concat(pool.slice(0,k));
  }
  const out=[];
  let need = nsets;
  const nEx = need<=5?1 : need<=9?2 : 3;
  const perEx = [];
  if(nEx===1) perEx.push(need);
  else if(nEx===2){ perEx.push(Math.ceil(need/2)); perEx.push(need-perEx[0]); }
  else { const a=Math.ceil(need/3); perEx.push(a,a,need-2*a); }
  let i=0;
  for(const e of pool){
    if(out.length>=nEx) break;
    if(usedPat.has(e.pat)) continue;
    usedPat.add(e.pat);
    const isMain = out.length===0 && e.t==="comp";
    const rs = repScheme(goal, e, isMain);
    out.push({id:e.id, name:e.n, muscle, sets:perEx[i]||need, reps:rs.reps, rir:rs.rir, cue:e.cue, stretch:!!e.stretch, type:e.t});
    i++;
  }
  if(out.length===0 && pool.length){
    const e=pool[0]; const rs=repScheme(goal,e,e.t==="comp");
    out.push({id:e.id,name:e.n,muscle,sets:need,reps:rs.reps,rir:rs.rir,cue:e.cue,stretch:!!e.stretch,type:e.t});
  }
  return out;
}

function generateProgram(input){
  input = Object.assign({level:"int", days:4, minutes:75, goal:"hyp", legs:true, emphasis:[], exclude:[]}, input||{});
  input.days = clamp(input.days,2,6);
  const split = chooseSplit(input.days, input.legs, input.goal, input.split);
  const vol = weeklyVolume(input);

  const dayCount = {};
  MUSCLES.forEach(m=> dayCount[m]=0);
  split.days.forEach(d=> d.muscles.forEach(m=>{ if(vol[m]>0) dayCount[m]++; }));

  const cap = sessionCap(input.minutes);
  const priority = ["quads","chest","lats","upback","hams","glutes","sdelt","triceps","biceps","rdelt","calves","traps","core"];
  const eqSet = new Set(input.equipment && input.equipment.length ? input.equipment : ["bb","db","cable","machine","bw"]);
  const banned = new Set();
  (input.limits||[]).forEach(k=>{ const L=LIMITS[k]; if(L) L.ban.forEach(id=>banned.add(id)); });

  const days = split.days.map((d, di)=>{
    const usedPat = new Set();
    const items = [];
    let dayMuscles = priority.filter(m=> d.muscles.indexOf(m)>=0 && vol[m]>0 && dayCount[m]>0);

    const maxEx = maxExercises(input.minutes, input.level);
    if(dayMuscles.length > maxEx){
      const keep = Math.min(3, maxEx);
      const head = dayMuscles.slice(0, keep);
      const tail = dayMuscles.slice(keep);
      const step = Math.max(1, maxEx - keep);
      const k = (di * step) % tail.length;
      const rotated = tail.slice(k).concat(tail.slice(0,k));
      const picked = head.concat(rotated).slice(0, maxEx);
      dayMuscles = priority.filter(m=> picked.indexOf(m)>=0);
    }

    const want = {};
    dayMuscles.forEach(m=>{ want[m] = Math.max(2, Math.round(vol[m]/dayCount[m])); });
    let sum = dayMuscles.reduce((a,m)=>a+want[m],0);

    if(sum > cap){
      const scale = cap/sum;
      dayMuscles.forEach(m=>{ want[m] = Math.max(2, Math.round(want[m]*scale)); });
      sum = dayMuscles.reduce((a,m)=>a+want[m],0);
      let guard = 0;
      while(sum > cap && guard++ < 100){
        let big = null;
        dayMuscles.forEach(m=>{ if(want[m] > 2 && (!big || want[m] > want[big])) big = m; });
        if(!big) break;
        want[big] -= 1; sum -= 1;
      }
    }

    for(const m of dayMuscles){
      if(want[m] < 2) continue;
      if(items.length >= maxEx) break;
      const chosen = pickExercises(m, want[m], eqSet, usedPat, input.goal, di, banned);
      for(const c of chosen){
        if(items.length >= maxEx) break;
        c.sets = clamp(c.sets, 2, 5);
        items.push(c);
      }
    }
    return {key:d.name, name:d.name, exercises:items};
  });

  const achieved = {};
  MUSCLES.forEach(m=> achieved[m]=0);
  days.forEach(d=> d.exercises.forEach(x=> achieved[x.muscle]+=x.sets));

  return {
    meta:{split:split.name, days:input.days, goal:input.goal, level:input.level, minutes:input.minutes, legs:input.legs},
    days,
    weeklyVolume:achieved,
    target:vol,
    progression: input.goal==="str"
      ? "Линейно-волновая: на главных базовых добавляй ~2.5 кг когда выбил все подходы в верхе диапазона при RIR 2. Аксессуары — двойная прогрессия."
      : input.goal==="cut"
      ? "На сушке цель — УДЕРЖАТЬ веса, а не расти. Держи прежние килограммы на базе; если вес на штанге падает 2 тренировки подряд — режь дефицит, а не подходы. Прибавка веса на изоляции — бонус, не требование."
      : "Двойная прогрессия: держи диапазон повторов, добавляй по повтору; выбил верх во всех подходах при RIR ≤1 → +вес (2.5 кг база / 1–2 кг изоляция). Делоад на 7–8 неделе.",
    notes: buildNotes(input, split, achieved, vol),
    limitNotes: (input.limits||[]).map(k=> LIMITS[k] ? {title:LIMITS[k].ru, note:LIMITS[k].note} : null).filter(Boolean)
  };
}

function buildNotes(input, split, achieved, target){
  const notes=[];
  notes.push("Сплит: "+split.name+" — "+input.days+" дн/нед.");
  if(!input.legs) notes.push("Ноги исключены по твоему выбору — программа только на верх.");
  const emph=(input.emphasis||[]).map(m=>MUSCLE_RU[m]).filter(Boolean);
  if(emph.length) notes.push("Акцент: "+emph.join(", ")+" (объём поднят).");
  notes.push(input.goal==="str"?"Цель — сила: мало повторов на базе, больше отдых (3–5 мин), техника в приоритете."
    : input.goal==="hybrid"?"Цель — сила+масса: тяжёлая база в 4–6 + гипертрофийная подсобка."
    : input.goal==="cut"?"Цель — сушка: база остаётся тяжёлой (5–8 повторов) — это защищает мышцы в дефиците. Изоляция уходит в 12–20 повторов. Объём чуть снижен: в дефиците восстановление хуже."
    : "Цель — гипертрофия: 6–15 повторов, RIR 0–2, отдых 1.5–3 мин.");
  if(input.goal==="cut"){
    notes.push("Кардио: 2–3 сессии по 20–30 мин или 8–10 тыс. шагов в день. Не заменяй им дефицит в еде — кардио дополняет, а не отменяет.");
    notes.push("Главный маркер, что сушка идёт правильно: вес падает, а веса на штанге стоят.");
  }
  return notes;
}

function clamp(x,a,b){ return Math.max(a, Math.min(b,x)); }
function r(x){ return Math.round(x); }

function bmr(input){
  const s = input.sex==="f" ? -161 : 5;
  if(input.bodyfat && input.bodyfat>3 && input.bodyfat<60){
    const lbm = input.weight*(1-input.bodyfat/100);
    return {value: 370 + 21.6*lbm, formula:"Кетч-МакАрдл (по % жира)"};
  }
  return {value: 10*input.weight + 6.25*input.height - 5*input.age + s, formula:"Миффлина–Сан Жеора"};
}

const ACTIVITY = {
  sed:   {mul:1.2,   ru:"Сидячий образ жизни"},
  light: {mul:1.375, ru:"Лёгкая активность (1–3 трен/нед)"},
  mod:   {mul:1.55,  ru:"Средняя (3–5 трен/нед)"},
  high:  {mul:1.725, ru:"Высокая (6–7 трен/нед)"},
  ath:   {mul:1.9,   ru:"Очень высокая (физическая работа + спорт)"}
};

function energy(input){
  const b = bmr(input);
  const act = ACTIVITY[input.activity] || ACTIVITY.light;
  const tdee = b.value*act.mul;
  let target, rate, label;
  switch(input.goal){
    case "cut":    target = tdee*0.80; rate="−0.5…−0.7 кг/нед"; label="Сушка"; break;
    case "bulk":   target = tdee*1.10; rate="+0.2…+0.35 кг/нед"; label="Набор массы"; break;
    case "recomp": target = tdee*1.00; rate="вес держится ровно"; label="Рекомпозиция"; break;
    default:       target = tdee;      rate="вес держится ровно"; label="Поддержание";
  }
  const floor = input.sex==="f" ? 1200 : 1500;
  let floored = false;
  if(target < floor){ target = floor; floored = true; }
  return {bmr:r(b.value), formula:b.formula, tdee:r(tdee), target:r(target), rate, label, activity:act.ru, floored, deficit:r(tdee-target)};
}

function macros(input, kcal){
  const w = input.weight;
  const set = new Set(input.restrictions||[]);
  let pPerKg = 2.0;
  if(input.goal==="cut") pPerKg = 2.2;
  if(set.has("vegan")) pPerKg += 0.2;
  if(input.age>=45) pPerKg = Math.max(pPerKg, 2.0);
  let protein = r(w*pPerKg);

  let fat = r(Math.max(w*0.8, kcal*0.22/9));
  let carbKcal = kcal - protein*4 - fat*9;
  if(carbKcal < kcal*0.15){
    fat = r(Math.max(w*0.5, (kcal - protein*4 - kcal*0.15)/9));
    carbKcal = kcal - protein*4 - fat*9;
  }
  if(carbKcal < 0){
    protein = r((kcal - fat*9)*0.45/4);
    carbKcal = kcal - protein*4 - fat*9;
  }
  const carbs = r(Math.max(0, carbKcal/4));
  const fiber = r(kcal/1000*14);
  return {protein, fat, carbs, fiber, pPerKg:Math.round(pPerKg*10)/10};
}

function allowedFoods(restrictions){
  const set = new Set(restrictions||[]);
  const banTags = new Set();
  let banMeat=false, keepFish=false;
  const notes=[];
  set.forEach(kR=>{
    const rule = RESTRICTIONS[kR];
    if(!rule) return;
    (rule.excludeTags||[]).forEach(t=>banTags.add(t));
    if(rule.excludeCatMeat) banMeat=true;
    if(rule.keepFish) keepFish=true;
    if(rule.note) notes.push(rule.note);
  });
  const banIds = new Set(restrictions && restrictions.filter(x=>x.indexOf("no:")===0).map(x=>x.slice(3)) || []);
  const foods = FOODS.filter(f=>{
    if(banIds.has(f.id)) return false;
    if(banMeat && MEAT_IDS.indexOf(f.id)>=0) return false;
    if(banMeat && !keepFish && FISH_IDS.indexOf(f.id)>=0) return false;
    for(const t of f.tags){ if(banTags.has(t)) return false; }
    return true;
  });
  return {foods, notes};
}

function pickRot(list, i){ return list.length ? list[i % list.length] : null; }

function buildMeals(input, m, foods, dayIndex){
  const nMeals = clamp(input.meals||4, 3, 6);
  const proteins = foods.filter(f=>f.cat==="protein" && f.p>=10);
  const carbsF = foods.filter(f=>f.cat==="carb");
  const fatsF = foods.filter(f=>f.cat==="fat");
  const vegF = foods.filter(f=>f.cat==="veg");
  if(!proteins.length) return {error:"Не осталось источников белка — ослабь ограничения."};

  const pPer = m.protein/nMeals;
  const cPer = m.carbs/nMeals;
  const fPer = m.fat/nMeals;
  const meals=[];
  for(let i=0;i<nMeals;i++){
    const pf = pickRot(proteins, i + dayIndex*2);
    const cf = pickRot(carbsF, i + dayIndex);
    const ff = pickRot(fatsF, i + dayIndex);
    const vf = pickRot(vegF, i + dayIndex);
    const gV = (vf && i<nMeals-1) ? 150 : 0;
    const useFat = !!ff;
    let gP = clamp(pPer/(pf.p/100), 30, 400);
    let gC = cf ? clamp(cPer/Math.max(cf.c/100,0.01), 20, 400) : 0;
    let gF = useFat ? clamp(fPer/Math.max(ff.f/100,0.01)*0.5, 3, 60) : 0;

    for(let it=0; it<12; it++){
      const curP = gP*pf.p/100 + (cf?gC*cf.c*0+gC*cf.p/100:0) + (useFat?gF*ff.p/100:0) + (gV?gV*vf.p/100:0);
      const curC = gP*pf.c/100 + (cf?gC*cf.c/100:0) + (useFat?gF*ff.c/100:0) + (gV?gV*vf.c/100:0);
      const curF = gP*pf.f/100 + (cf?gC*cf.f/100:0) + (useFat?gF*ff.f/100:0) + (gV?gV*vf.f/100:0);
      if(pf.p>0) gP = clamp(gP + (pPer-curP)/(pf.p/100)*0.7, 30, 400);
      if(cf && cf.c>0) gC = clamp(gC + (cPer-curC)/(cf.c/100)*0.7, 20, 400);
      if(useFat && ff.f>0) gF = clamp(gF + (fPer-curF)/(ff.f/100)*0.7, 0, 60);
    }
    const items=[];
    items.push(mkItem(pf, Math.round(gP/5)*5));
    if(cf) items.push(mkItem(cf, Math.round(gC/5)*5));
    if(useFat && gF>=3) items.push(mkItem(ff, Math.round(gF/2)*2));
    if(gV) items.push(mkItem(vf, gV));
    const tot = items.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fib:a.fib+x.fib}),{kcal:0,p:0,f:0,c:0,fib:0});
    meals.push({name: mealName(i,nMeals), items, total:{kcal:r(tot.kcal),p:r(tot.p),f:r(tot.f),c:r(tot.c),fib:r(tot.fib)}});
  }
  return {meals};
}

function mkItem(f, grams){
  return {id:f.id, ru:f.ru, grams, kcal:f.kcal*grams/100, p:f.p*grams/100, f:f.f*grams/100, c:f.c*grams/100, fib:f.fib*grams/100};
}

function mealName(i,n){
  if(n===3) return ["Завтрак","Обед","Ужин"][i];
  if(n===4) return ["Завтрак","Обед","Перекус","Ужин"][i];
  if(n===5) return ["Завтрак","Перекус","Обед","Перекус 2","Ужин"][i];
  return ["Завтрак","Перекус","Обед","Перекус 2","Ужин","Перед сном"][i];
}

function generateNutrition(input){
  input = Object.assign({sex:"m",age:30,height:180,weight:80,activity:"light",goal:"recomp",meals:4,restrictions:[]}, input||{});
  const e = energy(input);
  const m = macros(input, e.target);
  const {foods, notes} = allowedFoods(input.restrictions);
  const goalNotes = [];
  if(input.goal==="cut"){
    goalNotes.push("Белок поднят до "+m.pPerKg+" г/кг — в дефиците это главная защита мышц.");
    goalNotes.push("Раз в 7–10 дней сделай рефид: +25–30% калорий углеводами (не жиром). Помогает гормонам, тренировкам и голове.");
    goalNotes.push("Дефицит ~"+e.deficit+" ккал/день. Если вес не падает 2–3 недели подряд — режь ещё на 150–200 ккал, не больше.");
    goalNotes.push("Овощи и объёмная еда — твой друг: они дают сытость почти без калорий.");
    if(e.floored) goalNotes.push("⚠ Расчётный дефицит упирался в безопасный минимум калорий — цель поднята до "+e.target+" ккал.");
  }
  if(input.goal==="bulk"){
    goalNotes.push("Если за 2–3 недели вес стоит — добавь 150–200 ккал углеводами. Растёшь быстрее 0.4 кг/нед — убавь: лишнее уйдёт в жир.");
  }
  const day = buildMeals(input, m, foods, input.dayIndex||0);

function setsForWeek(base, w){
  if(w<=2) return Math.max(2, base-1);
  if(w>=7) return Math.max(2, base-1);
  return base;
}

function exercisesForWeek(list, w){
  var pairs = list.map(function(x,i){ return {x:x, i:i}; });
  var frac = (w<=2) ? 0.6 : (w===7 ? 0.6 : 1);
  if(frac>=1) return pairs;
  var n = Math.max(4, Math.round(list.length*frac));
  return pairs.slice(0, n);
}

function logKey(di, xi, si){ return S.week+"|"+di+"|"+xi+"|"+si; }

function lastLogged(di, xi, si){
  for(var w=S.week-1; w>=1; w--){
    var r=S.log[w+"|"+di+"|"+xi+"|"+si];
    if(r && r.w) return r;
  }
  return null;
}

function paintRest(){
  var b=document.getElementById("rest"); if(!b) return;

  b.innerHTML='<span class="rl">Отдых</span><b class="rt">'+m+":"+(s<10?"0":"")+s+'</b>';
  var x=el("button","rx","Стоп"); x.onclick=stopRest; b.appendChild(x);
}

function phaseFor(w){
  if(w<=2) return "Вкатывание · RIR 3–4";

  return "Проходка · тест силы";

function renderTrain(main, prog){
  var nav = el("div","daynav");

    var b=el("button","dbtn", esc(d.name));

    var n = setsForWeek(p.x.sets, S.week);
    totalSets += n;
    for(var si=0; si<n; si++){ if(S.log[logKey(S.dayIdx,p.i,si)] && S.log[logKey(S.dayIdx,p.i,si)].done) doneSets++; }

    var sets = el("div","sets");
    for(var si=0; si<n; si++){

        var row = el("div","srow"+(rec.done?" done":""));

        i1.placeholder = prev ? String(prev.w) : "";

        f1.appendChild(i1); f1.appendChild(el("span","unit","кг")); row.appendChild(f1);
        var f2=el("div","fld"); var i2=el("input"); i2.type="text"; i2.inputMode="numeric"; i2.value=rec.r;
        i2.placeholder = prev ? String(prev.r) : "";

function finishSession(){
  var day=S.program.days[S.dayIdx], total=0, any=false;
  day.exercises.forEach(function(x,xi){
    var n=setsForWeek(x.sets,S.week);
    for(var si=0;si<n;si++){
      var r=S.log[logKey(S.dayIdx,xi,si)];
      if(r){ var w=parseFloat(String(r.w).replace(",","."))||0, rr=parseFloat(r.r)||0; if(w>0&&rr>0){ total+=w*rr; any=true; } }
    }
  });
  if(!any){ toast("Нет вписанных подходов"); return; }
  var d=new Date();
  var ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  S.history.push({d:ds, day:day.name, total:Math.round(total), week:S.week});
  day.exercises.forEach(function(x,xi){
    var n=setsForWeek(x.sets,S.week);
    for(var si=0;si<n;si++){ var k=logKey(S.dayIdx,xi,si); if(S.log[k]) S.log[k].done=false; }
  });
  save(); render(); toast("Записано ✓");
}

function renderFood(main, nut){
  var e=nut.energy, m=nut.macros;
  var tiles=el("div","tiles");
  [["ккал",e.target],["белок",m.protein+"г"],["жиры",m.fat+"г"],["угл.",m.carbs+"г"]].forEach(function(t,i){
    var d=el("div","tile"+(i===0?" acc":""));
    d.appendChild(el("span","tk",t[0]));
    d.appendChild(el("span","tv",String(t[1])));
    tiles.appendChild(d);
  });
  main.appendChild(tiles);
  main.appendChild(el("p","hint", esc(e.label)+" · "+esc(e.rate)+" · TDEE ≈ "+e.tdee+" ккал ("+esc(e.formula)+")"));

  var p0=S.profile;
  if(p0 && p0.goal==="cut" && p0.nutgoal==="bulk"){
    main.appendChild(el("div","warn","⚠ Тренировки настроены на сушку, а питание — на набор массы. Это противоречие: выбери одно. Пересобрать программу можно во вкладке «Профиль»."));
  }
  if(nut.goalNotes && nut.goalNotes.length){
    var g=el("div","warn");
    nut.goalNotes.forEach(function(n){ g.appendChild(el("div",null, esc(n))); });
    main.appendChild(g);
  }
  if(nut.restrictionNotes && nut.restrictionNotes.length){
    var w=el("div","warn");
    nut.restrictionNotes.forEach(function(n){ w.appendChild(el("div",null,"⚠ "+esc(n))); });
    main.appendChild(w);
  }

  if(nut.day && nut.day.error){ main.appendChild(el("div","warn", esc(nut.day.error))); return; }
  (nut.day.meals||[]).forEach(function(meal){
    var c=el("div","card");
    c.appendChild(el("h3",null, esc(meal.name)+" <small>"+meal.total.kcal+" ккал · Б"+meal.total.p+"</small>"));
    var ul=el("div","fitems");
    meal.items.forEach(function(it){
      ul.appendChild(el("div","fitem","<span>"+esc(it.ru)+"</span><b>"+it.grams+" г</b>"));
    });
    c.appendChild(ul);
    main.appendChild(c);
  });

  var reroll=el("button","ghost-btn","Другой вариант меню");
  reroll.onclick=function(){
    var p=S.profile;
    S.nutrition=FORGE.generateNutrition({sex:p.sex,age:p.age,height:p.height,weight:p.weight,activity:p.activity,goal:p.nutgoal,meals:p.meals,restrictions:p.restrictions,dayIndex:(S.nutrition._i||0)+1});
    S.nutrition._i=(S.nutrition._i||0)+1;
    save(); render();
  };
  main.appendChild(reroll);
}

function renderProfile(main){
  var p=S.profile, prog=S.program;
  var c=el("div","card");
  c.appendChild(el("h3",null,"Профиль"));
  var rows=[
    ["Параметры", p.height+" см · "+p.weight+" кг · "+p.age+" лет"],
    ["Стаж", {beg:"новичок",int:"средний",adv:"опытный"}[p.level]],
    ["Программа", prog.meta.split],
    ["Тренировок", p.days+"/нед по "+p.minutes+" мин"],
    ["Цель", {hyp:"гипертрофия",str:"сила",hybrid:"сила+масса",cut:"сушка"}[p.goal]]
  ];
  var t=el("div","prows");
  rows.forEach(function(r){ t.appendChild(el("div","prow","<span>"+esc(r[0])+"</span><b>"+esc(r[1])+"</b>")); });
  c.appendChild(t);
  main.appendChild(c);

  var v=el("div","card");
  v.appendChild(el("h3",null,"Недельный объём"));
  var vv=el("div","prows");
  Object.keys(prog.weeklyVolume).forEach(function(k){
    if(prog.weeklyVolume[k]>0) vv.appendChild(el("div","prow","<span>"+esc(FORGE.MUSCLE_RU[k])+"</span><b>"+prog.weeklyVolume[k]+" подх.</b>"));
  });
  v.appendChild(vv);
  main.appendChild(v);

  if(prog.limitNotes && prog.limitNotes.length){
    var lc=el("div","card");
    lc.appendChild(el("h3",null,"Твои ограничения"));
    prog.limitNotes.forEach(function(x){
      lc.appendChild(el("div","prow","<b>"+esc(x.title)+"</b>"));
      lc.appendChild(el("p","hint", esc(x.note)));
    });
    main.appendChild(lc);
  }

  var n=el("div","card");
  n.appendChild(el("h3",null,"Прогрессия"));
  n.appendChild(el("p","hint", esc(prog.progression)));
  if(prog.notes) prog.notes.forEach(function(t){ n.appendChild(el("p","hint","• "+esc(t))); });
  main.appendChild(n);

  var again=el("button","accent-btn","Пересобрать программу");
  again.onclick=function(){ if(confirm("Заново пройти анкету? Логи тренировок и история сохранятся.")) startWizard(); };
  main.appendChild(again);
  main.appendChild(el("p","hint","Пройдёшь анкету заново — программа и рацион соберутся с нуля. История тренировок останется."));

  var wipe=el("button","ghost-btn danger","Сбросить всё");
  wipe.onclick=function(){
    if(!confirm("Стереть профиль, программу и все логи?")) return;
    try{localStorage.removeItem(KEY);}catch(e){}
    S={step:"intro",profile:null,program:null,nutrition:null,log:{},history:[],week:1,tab:"train",dayIdx:0,version:APP_VERSION};
    mem=null; save(); render();
  };
  main.appendChild(wipe);
}

function renderIntro(){
  var root=$("app"); root.innerHTML="";
  var c=el("div","intro");
  c.appendChild(el("h1",null,"FORGE"));
  c.appendChild(el("p","lead","Составлю тренировки и питание под тебя — по твоим данным, целям, инвентарю и ограничениям в еде."));
  var f=el("div","feats");
  [["Программа","сплит, объём и упражнения под твой стаж, дни и время"],
   ["Питание","калории, макросы и меню с учётом аллергий и диет"],
   ["Трекинг","логируешь веса, ведёшь прогресс по неделям"]].forEach(function(x){
    f.appendChild(el("div","feat","<b>"+esc(x[0])+"</b><span>"+esc(x[1])+"</span>"));
  });
  c.appendChild(f);
  var go=el("button","accent-btn big","Собрать программу");
  go.onclick=startWizard;
  c.appendChild(go);
  c.appendChild(el("p","fine","Работает офлайн. Все данные остаются на твоём устройстве."));
  root.appendChild(c);
}

var tt;
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("show"); },1800);
}

var RF_RU={rest_pain:"сильная боль в покое или ночью",numb:"онемение или прострелы в конечность",
  acute:"свежая травма или операция",bulge:"выпирание/боль в паху при кашле",lock:"сустав заклинивает или подкашивается"};

function renderRedflag(){
  var root=$("app"); root.innerHTML="";
  var c=el("div","intro");
  c.appendChild(el("h2",null,"Сначала — к врачу"));
  var list=(S.profile.redflags||[]).map(function(k){ return "• "+(RF_RU[k]||k); }).join("<br>");
  c.appendChild(el("div","warn","Ты отметил:<br>"+list));
  c.appendChild(el("p","lead","Это признаки, при которых нагрузку подбирают не по анкете, а после осмотра. Тренировки сейчас могут усугубить проблему, а я не могу тебя осмотреть и не заменяю врача."));
  c.appendChild(el("p","hint","Сходи к травматологу или спортивному врачу. Программа никуда не денется — она сохранена и будет ждать."));
  var b=el("button","ghost-btn","Я был у врача, мне разрешили тренироваться");
  b.onclick=function(){ S.step="app"; save(); render(); };
  c.appendChild(b);
  root.appendChild(c);
}

function render(){
  if(S.step==="redflag" && S.profile) renderRedflag();
  else if(S.step==="wizard") renderWizard();
  else if(S.step==="app" && S.program) renderApp();
  else renderIntro();
  window.scrollTo(0,0);
}

window.FORGE_UI={render:render};
render();
})();
</script>
