# Proxy for the «Спросить» screen. The Gemini key is a secret:
#   npx wrangler secret put GEMINI_API_KEY
name = "forge-ask"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Tried in order: when one is overloaded or slow, the next answers.
# 3.8 Flash is last: on 22 Oct 2026 it timed out on the free tier while 3.6 answered in 4 s.
MODELS = "gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.8-flash"
ALLOWED_ORIGINS = "https://feadal.github.io"

# Per address: 5 questions a minute.
[[ratelimits]]
name = "PER_USER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# Everyone together: stays under the free Gemini quota of about 10 requests a minute.
[[ratelimits]]
name = "ALL"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 9
  period = 60

# Install pings (POST /ping): 10 a minute per address is plenty for a once-a-day ping.
[[ratelimits]]
name = "PING"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Install counts for /stats. Create once with: npx wrangler d1 create forge-stats
# then: npx wrangler d1 execute forge-stats --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "forge-stats"
database_id = "a5b12595-b83f-483f-b4d4-64bc1f534d47"

# Sign-in attempts on /stats: 5 a minute per address.
[[ratelimits]]
name = "LOGIN"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 5
  period = 60
