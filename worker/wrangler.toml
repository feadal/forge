# FORGE proxy: «Спросить», the daily install ping and the stats page. The Gemini key is a secret:
#   npx wrangler secret put GEMINI_API_KEY
name = "forge-ask"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Tried in order: when one is overloaded, slow or out of its daily quota, the next answers.
# On 22 Oct 2026 the free Gemini tier allowed 20 questions a day per model, each model counted
# apart. Models starting with @cf/ run on Workers AI and share one free daily allowance; there
# Gemma 4, Llama 4 Scout and Mistral Small answered text and photos in 1-7 s. Gemini 3.1 Flash-Lite
# was often overloaded and 3.8 Flash timed out, so they are last.
MODELS = "gemini-3.6-flash,@cf/google/gemma-4-26b-a4b-it,gemini-3.5-flash-lite,@cf/meta/llama-4-scout-17b-16e-instruct,@cf/mistralai/mistral-small-3.1-24b-instruct,gemini-3.1-flash-lite,gemini-3.8-flash"
ALLOWED_ORIGINS = "https://feadal.github.io"

# Per address: 5 questions a minute.
[[ratelimits]]
name = "PER_USER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# Everyone together: stays under the free Gemini quota of about 10 requests a minute.
[[ratelimits]]
name = "ALL"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 9
  period = 60

# Install pings (POST /ping): 10 a minute per address is plenty for a once-a-day ping.
[[ratelimits]]
name = "PING"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Cloudflare's own models (the @cf/ names in MODELS): no key, a free daily allowance.
[ai]
binding = "AI"

# Install counts for /stats. Create once with: npx wrangler d1 create forge-stats
# then: npx wrangler d1 execute forge-stats --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "forge-stats"
database_id = "a5b12595-b83f-483f-b4d4-64bc1f534d47"

# Sign-in attempts on /stats: 5 a minute per address.
[[ratelimits]]
name = "LOGIN"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 5
  period = 60

# Sign-in attempts from everyone together: 20 a minute, so rotating addresses cannot guess faster.
[[ratelimits]]
name = "LOGIN_ALL"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 20
  period = 60
